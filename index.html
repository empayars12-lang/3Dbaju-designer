<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pro Designer 3D - Studio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #121212; color: #f3f4f6; }
    
    #app { display: flex; height: 100vh; }
    
    /* PANEL KIRI */
    #sidebar-left {
      width: 300px; background: #18181b; padding: 20px; display: flex; flex-direction: column; gap: 16px;
      border-right: 1px solid #27272a; z-index: 10; overflow-y: auto;
    }
    .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #a1a1aa; margin-bottom: 8px; }
    
    .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .color-btn { aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: 0.2s; }
    .color-btn.active { border-color: #38bdf8; transform: scale(1.1); }
    
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group input[type="color"] { width: 100%; height: 35px; border: none; background: #27272a; cursor: pointer; border-radius: 6px; padding: 2px;}
    .input-group input[type="range"] { width: 100%; accent-color: #38bdf8; cursor: pointer; }
    .input-group input[type="text"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #3f3f46; background: #27272a; color: #fff; font-family: inherit; }

    .btn { padding: 12px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; text-align: center; border: none; transition: 0.2s; font-family: inherit; }
    .btn-primary { background: #38bdf8; color: #000; }
    .btn-primary:hover { background: #0ea5e9; }
    .btn-secondary { background: #27272a; color: #d4d4d8; border: 1px solid #3f3f46; }
    .btn-secondary:hover { background: #3f3f46; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-success:hover { background: #059669; }
    
    .row-buttons { display: flex; gap: 8px; }
    .row-buttons .btn { flex: 1; padding: 10px 4px; }

    /* KAWASAN 3D */
    #viewer-container { flex: 1; position: relative; background: radial-gradient(circle at center, #27272a 0%, #09090b 100%); }
    #viewer-container canvas { display: block; }
    
    #view-toggles {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; background: rgba(24, 24, 27, 0.8); padding: 8px; border-radius: 12px; backdrop-filter: blur(10px);
    }
    
    /* PANEL KANAN (LAYERS) */
    #sidebar-right { width: 280px; background: #18181b; border-left: 1px solid #27272a; z-index: 10; display: flex; flex-direction: column; }
    #layers-header { padding: 20px; border-bottom: 1px solid #27272a; }
    #layers-header h2 { font-size: 12px; font-weight: 600; color: #e4e4e7; text-transform: uppercase; }
    #layers-list { flex: 1; overflow-y: auto; }
    .layer-item { padding: 12px 20px; border-bottom: 1px solid #27272a; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; font-size: 13px; color: #d4d4d8; }
    .layer-item:hover { background: #27272a; }
    .layer-item.active { background: rgba(56, 189, 248, 0.1); border-left: 3px solid #38bdf8; color: #38bdf8; font-weight: 600; }
    .layer-info { display: flex; align-items: center; gap: 10px; flex: 1; }
    .layer-actions { display: flex; gap: 6px; }
    
    .action-btn { background: #3f3f46; border: none; color: #fff; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; transition: 0.2s; }
    .action-btn:hover { background: #52525b; }
    .action-btn.apply { background: #10b981; }
    .action-btn.apply:hover { background: #059669; }
    .action-btn.delete { background: #ef4444; }
    .action-btn.delete:hover { background: #dc2626; }

    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #09090b; color: #38bdf8; z-index: 100; font-weight: 600; letter-spacing: 2px; transition: opacity 0.5s; }
    
    .slider-container { display: none; margin-top: 10px; background: #27272a; padding: 10px; border-radius: 8px; border: 1px solid #3f3f46;}
    .slider-container.active { display: block; }
  </style>
</head>
<body>

<div id="app">
  <div id="sidebar-left">
    <div>
      <div class="section-title">Warna Baju</div>
      <div class="color-grid" id="colorGrid"></div>
      <div class="input-group" style="margin-top: 10px;">
        <input type="color" id="customShirtColor" value="#ffffff">
      </div>
    </div>
    
    <div>
      <div class="section-title">Tambah Rekaan</div>
      <div class="input-group">
        <div class="btn btn-primary" style="position:relative; overflow:hidden;">
          + Upload Logo
          <input type="file" id="logoUpload" accept="image/*" style="position:absolute; inset:0; opacity:0; cursor:pointer;">
        </div>
      </div>
    </div>

    <div>
      <div class="section-title">Tambah Teks</div>
      <div class="input-group">
        <input type="text" id="textInput" placeholder="Taip teks di sini..." />
        <div class="row-buttons">
          <input type="color" id="textColor" value="#000000" style="height: 35px; width: 40px;">
          <button class="btn btn-secondary" id="addTextBtn" style="flex: 1;">Tambah Teks</button>
        </div>
      </div>
    </div>

    <div id="transform-controls" class="slider-container">
      <div class="section-title" style="margin-bottom: 8px;">Kawalan Preview</div>
      <div class="row-buttons" style="margin-bottom: 8px;">
        <button class="btn btn-secondary" id="btnTranslate">✥ Gerak</button>
        <button class="btn btn-secondary" id="btnScale">⤢ Saiz</button>
      </div>
      <div class="input-group">
        <label style="font-size: 11px; color: #a1a1aa;">Putar (Rotate)</label>
        <input type="range" id="rotateSlider" min="-180" max="180" step="1" value="0">
      </div>
    </div>

    <button class="btn btn-success" id="saveBtn" style="margin-top: auto;">⬇️ Simpan Imej HD</button>
  </div>
  
  <div id="viewer-container">
    <div id="loading">MEMUATKAN STUDIO...</div>
    <div id="view-toggles">
      <button class="btn btn-secondary" id="viewFront">Pandangan Depan</button>
      <button class="btn btn-secondary" id="viewBack">Pandangan Belakang</button>
    </div>
  </div>

  <div id="sidebar-right">
    <div id="layers-header"><h2>Senarai Layer</h2></div>
    <div id="layers-list"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ===== 1. SETUP ASAS =====
const container = document.getElementById('viewer-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Environment
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// Lampu & Shadow
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 2);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
scene.add(dirLight);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.ShadowMaterial({ opacity: 0.3 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.2;
ground.receiveShadow = true;
scene.add(ground);

// Kamera & Kawalan
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 10;

// Gizmo
const transformControls = new TransformControls(camera, renderer.domElement);
transformControls.setSize(0.8);
const transformHelper = transformControls.getHelper();
scene.add(transformHelper);

transformControls.addEventListener('dragging-changed', (e) => {
  controls.enabled = !e.value;
});

// ===== 2. STATE & MODEL =====
const shirtGroup = new THREE.Group();
scene.add(shirtGroup);
let shirtMesh = null;
let shirtMaterials = [];
let layers = [];
let activeLayer = null;
let previewController = null; // Objek halimunan untuk kawal Gizmo
let previewPlane = null;      // Imej 2D yang melekat pada baju
let previewTexture = null;
let logoSeq = 0;

const layerListUI = document.getElementById('layers-list');
const transformUI = document.getElementById('transform-controls');
const rotateSlider = document.getElementById('rotateSlider');

// Load Model
new GLTFLoader().load('./T_shirt_gltf.gltf', 
  (gltf) => setupShirt(gltf.scene), 
  undefined, 
  () => buildFallbackShirt()
);

function setupShirt(model) {
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  model.scale.setScalar(2.4 / maxDim);
  model.updateMatrixWorld(true);

  box.setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(center);
  model.updateMatrixWorld(true);

  model.traverse((child) => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
      const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, metalness: 0.1 });
      child.material = mat;
      shirtMaterials.push(mat);
    }
  });

  shirtMesh = model;
  shirtGroup.add(model);
  ground.position.y = box.min.y - 0.1;

  fitCamera();
  finishLoading();
  addBaseLayer();
}

function buildFallbackShirt() {
  const geo = new RoundedBoxGeometry(1.5, 1.9, 0.5, 4, 0.1);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 }));
  mesh.castShadow = true; mesh.receiveShadow = true;
  shirtMaterials.push(mesh.material);
  shirtMesh = mesh;
  shirtGroup.add(mesh);
  ground.position.y = -1.0;
  fitCamera();
  finishLoading();
  addBaseLayer();
}

function finishLoading() {
  const el = document.getElementById('loading');
  el.style.opacity = '0';
  setTimeout(() => el.remove(), 500);
}

function fitCamera() {
  camera.position.set(0, 0, 4.5);
  controls.target.set(0, 0, 0);
  controls.update();
}

// ===== 3. SISTEM LAYER =====
function addBaseLayer() {
  const el = document.createElement('div');
  el.className = 'layer-item active';
  el.innerHTML = `<div class="layer-info"><span>👕</span> <span>Baju 3D (Asas)</span></div>`;
  el.onclick = () => {
    if(previewController) return; // Kunci jika tgh preview
    document.querySelectorAll('.layer-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    transformControls.attach(shirtGroup);
    transformUI.classList.remove('active');
  };
  layerListUI.prepend(el);
}

function addDesignLayer(type, texture, aspect, isText = false) {
  const id = 'layer-' + Date.now();
  const name = isText ? 'Teks' : `Logo ${++logoSeq}`;
  const icon = isText ? '📝' : '🖼️';
  
  const el = document.createElement('div');
  el.className = 'layer-item';
  el.id = id;
  el.innerHTML = `
    <div class="layer-info"><span>${icon}</span> <span>${name}</span></div>
    <div class="layer-actions">
      <button class="action-btn apply">✓</button>
      <button class="action-btn delete">✕</button>
    </div>
  `;

  const layerObj = { id, type: 'preview', mesh: null, controller: null, texture, aspect, name, isText, el };
  layers.push(layerObj);

  el.onclick = () => selectLayer(layerObj);
  el.querySelector('.delete').onclick = (e) => { e.stopPropagation(); deleteLayer(layerObj); };
  el.querySelector('.apply').onclick = (e) => { e.stopPropagation(); bakeLayer(layerObj); };

  layerListUI.prepend(el);
  startPreview(layerObj);
}

// ===== 4. SISTEM PREVIEW (STABIL & LAJU) =====
const raycaster = new THREE.Raycaster();

function startPreview(layer) {
  // Bersihkan preview lama jika ada
  if (previewController) {
    scene.remove(previewController);
    scene.remove(previewPlane);
  }

  layer.type = 'preview';
  layer.el.querySelector('.apply').style.display = 'block';
  
  const w = 0.6;
  const h = w / layer.aspect;

  // 1. Controller (Objek Halimunan untuk Gizmo)
  const cGeo = new THREE.PlaneGeometry(w, h);
  const cMat = new THREE.MeshBasicMaterial({ visible: false });
  const controller = new THREE.Mesh(cGeo, cMat);
  
  // 2. Plane (Imej 2D yang nampak)
  const pGeo = new THREE.PlaneGeometry(w, h);
  const pMat = new THREE.MeshStandardMaterial({ 
    map: layer.texture, 
    transparent: true, 
    opacity: 0.9,
    polygonOffset: true, 
    polygonOffsetFactor: -4,
    depthTest: true,
    depthWrite: false,
    side: THREE.DoubleSide
  });
  const plane = new THREE.Mesh(pGeo, pMat);
  plane.renderOrder = 2;

  // Letak di tengah baju (berdasarkan raycast dari kamera)
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const hits = raycaster.intersectObject(shirtMesh, true);
  if (hits.length > 0) {
    const pt = hits[0].point;
    const n = hits[0].face.normal.clone().transformDirection(hits[0].object.matrixWorld);
    controller.position.copy(pt).addScaledVector(n, 0.05);
    plane.position.copy(controller.position);
    plane.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), n);
    controller.quaternion.copy(plane.quaternion);
  } else {
    controller.position.set(0, 0, 1.5);
    plane.position.copy(controller.position);
  }

  scene.add(controller);
  scene.add(plane);

  layer.controller = controller;
  layer.mesh = plane;

  previewController = controller;
  previewPlane = plane;
  previewTexture = layer.texture;

  // Attach Gizmo ke Controller
  transformControls.attach(controller);
  transformControls.setMode('translate');
  transformUI.classList.add('active');
  rotateSlider.value = 0;

  selectLayer(layer);
}

// Update Plane mengikut pergerakan Gizmo
transformControls.addEventListener('objectChange', () => {
  if (!previewController || !previewPlane) return;

  // Tembak raycast dari kamera ke arah Controller
  const dir = previewController.position.clone().sub(camera.position).normalize();
  raycaster.set(camera.position, dir);
  const hits = raycaster.intersectObject(shirtMesh, true);

  if (hits.length > 0) {
    const hit = hits[0];
    const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
    
    // Snap posisi ke baju
    previewPlane.position.copy(hit.point).addScaledVector(n, 0.015);
    previewController.position.copy(hit.point).addScaledVector(n, 0.015);
    
    // Orientasi plane ikut normal
    const baseQ = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), n);
    
    // Apply rotate slider
    const angle = THREE.MathUtils.degToRad(parseFloat(rotateSlider.value));
    const rotQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), angle);
    
    previewPlane.quaternion.copy(baseQ).multiply(rotQ);
    
    // Scale ikut Gizmo
    previewPlane.scale.copy(previewController.scale);
    previewPlane.material.opacity = 0.9;
  } else {
    // Jika terkeluar dari baju, buat ia lutsinar
    previewPlane.material.opacity = 0.1;
  }
});

// ===== 5. BAKE & EDIT =====
function bakeLayer(layer) {
  if (layer.type === 'baked') return;
  
  transformControls.detach();
  
  // Tukar posisi world ke local (shirtMesh)
  shirtGroup.updateMatrixWorld(true);
  const localPos = shirtGroup.worldToLocal(layer.mesh.position.clone());
  const localRot = layer.mesh.quaternion.clone();
  const localScale = layer.mesh.scale.clone();

  const w = 0.6 * localScale.x;
  const h = (0.6 / layer.aspect) * localScale.y;
  const size = new THREE.Vector3(w, h, 0.2);

  // Jana Decal
  const decalGeo = new DecalGeometry(shirtMesh, localPos, localRot, size);
  const decalMat = new THREE.MeshStandardMaterial({
    map: layer.texture,
    transparent: true,
    depthTest: true,
    depthWrite: false,
    polygonOffset: true,
    polygonOffsetFactor: -4,
    roughness: 0.8
  });

  const decalMesh = new THREE.Mesh(decalGeo, decalMat);
  decalMesh.renderOrder = 2;
  
  shirtGroup.add(decalMesh);
  
  // Buang preview
  scene.remove(layer.controller);
  scene.remove(layer.mesh);
  previewController = null;
  previewPlane = null;

  // Update UI
  layer.type = 'baked';
  layer.mesh = decalMesh;
  layer.controller = null;
  layer.el.querySelector('.apply').style.display = 'none';
  layer.el.querySelector('.delete').innerHTML = '✏️'; // Tukar butang padam jadi Edit
  layer.el.querySelector('.delete').onclick = (e) => { e.stopPropagation(); editLayer(layer); };
  
  // Tambah butang padam asli
  const delBtn = document.createElement('button');
  delBtn.className = 'action-btn delete';
  delBtn.innerHTML = '✕';
  delBtn.onclick = (e) => { e.stopPropagation(); deleteLayer(layer); };
  layer.el.querySelector('.layer-actions').appendChild(delBtn);

  transformUI.classList.remove('active');
}

function editLayer(layer) {
  if (layer.type === 'baked') {
    // Buang decal
    shirtGroup.remove(layer.mesh);
    layer.mesh.geometry.dispose();
    layer.mesh.material.dispose();
    
    // Reset UI
    const applyBtn = layer.el.querySelector('.apply');
    applyBtn.style.display = 'block';
    layer.el.querySelector('.layer-actions').innerHTML = `<button class="action-btn apply">✓</button><button class="action-btn delete">✕</button>`;
    layer.el.querySelector('.apply').onclick = (e) => { e.stopPropagation(); bakeLayer(layer); };
    layer.el.querySelector('.delete').onclick = (e) => { e.stopPropagation(); deleteLayer(layer); };

    // Kembali ke Preview
    startPreview(layer);
  }
}

function deleteLayer(layer) {
  if (layer.type === 'preview') {
    scene.remove(layer.controller);
    scene.remove(layer.mesh);
    previewController = null;
    previewPlane = null;
    transformControls.detach();
  } else {
    shirtGroup.remove(layer.mesh);
    layer.mesh.geometry.dispose();
    layer.mesh.material.dispose();
  }
  
  if (layer.texture) layer.texture.dispose();
  layer.el.remove();
  layers = layers.filter(l => l !== layer);
  
  transformUI.classList.remove('active');
}

function selectLayer(layer) {
  document.querySelectorAll('.layer-item').forEach(i => i.classList.remove('active'));
  layer.el.classList.add('active');
  activeLayer = layer;

  if (layer.type === 'preview') {
    transformControls.attach(layer.controller);
    transformUI.classList.add('active');
    rotateSlider.value = 0;
  } else {
    transformControls.detach();
    transformUI.classList.remove('active');
  }
}

// ===== 6. UPLOAD & TEXT =====
document.getElementById('logoUpload').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const texture = new THREE.Texture(img);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;
      addDesignLayer('logo', texture, img.width / img.height);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

document.getElementById('addTextBtn').onclick = () => {
  const text = document.getElementById('textInput').value;
  const color = document.getElementById('textColor').value;
  if (!text) return;

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 1024;
  canvas.height = 256;
  ctx.fillStyle = color;
  ctx.font = "bold 120px Inter, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, 512, 128);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  addDesignLayer('text', texture, canvas.width / canvas.height, true);
  document.getElementById('textInput').value = '';
};

// ===== 7. KAWALAN SLIDER & UI =====
document.getElementById('btnTranslate').onclick = () => transformControls.setMode('translate');
document.getElementById('btnScale').onclick = () => transformControls.setMode('scale');

rotateSlider.addEventListener('input', () => {
  if (previewController) {
    // Trigger manual objectChange
    const event = { type: 'objectChange' };
    transformControls.dispatchEvent(event);
  }
});

// Warna Baju
const colors = ['#ffffff', '#171717', '#64748b', '#dc2626', '#2563eb', '#16a34a', '#ca8a04', '#9333ea'];
const grid = document.getElementById('colorGrid');
colors.forEach((hex, i) => {
  const btn = document.createElement('button');
  btn.className = 'color-btn' + (i === 0 ? ' active' : '');
  btn.style.background = hex;
  btn.onclick = () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    shirtMaterials.forEach(m => m.color.set(hex));
  };
  grid.appendChild(btn);
});

document.getElementById('customShirtColor').oninput = (e) => {
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
  shirtMaterials.forEach(m => m.color.set(e.target.value));
};

// Pandangan Kamera
document.getElementById('viewFront').onclick = () => { camera.position.set(0, 0, 4.5); controls.target.set(0, 0, 0); };
document.getElementById('viewBack').onclick = () => { camera.position.set(0, 0, -4.5); controls.target.set(0, 0, 0); };

// Simpan HD
document.getElementById('saveBtn').onclick = () => {
  transformHelper.visible = false;
  const currentSize = renderer.getSize(new THREE.Vector2());
  
  renderer.setSize(2000, 2000, false);
  renderer.render(scene, camera);
  const dataURL = renderer.domElement.toDataURL('image/png');
  
  renderer.setSize(currentSize.x, currentSize.y, false);
  transformHelper.visible = true;
  renderer.render(scene, camera);

  const link = document.createElement('a');
  link.download = 'design-baju-hd.png';
  link.href = dataURL;
  link.click();
};

// ===== 8. RENDER LOOP =====
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

function onResize() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  if(!w || !h) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);
onResize();

</script>
</body>
