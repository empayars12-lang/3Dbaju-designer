<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pro Baju Designer 3D</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; }
    
    #app { display: flex; height: 100vh; background: #121212; color: #fff; }
    
    /* PANEL KIRI (KAWALAN) */
    #sidebar {
      width: 300px; background: #1e1e24; padding: 20px; display: flex; flex-direction: column; gap: 20px;
      border-right: 1px solid #333; z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    }
    #sidebar h2 { font-size: 16px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; margin-bottom: 10px;}
    
    /* Warna */
    .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .color-btn {
      aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
      transition: all 0.2s; position: relative;
    }
    .color-btn:hover { transform: scale(1.1); }
    .color-btn.active { border-color: #38bdf8; transform: scale(1.1); }
    
    /* Upload Logo */
    .upload-btn {
      background: #38bdf8; color: #000; text-align: center; padding: 12px; border-radius: 8px;
      font-weight: 600; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;
    }
    .upload-btn:hover { background: #0ea5e9; }
    .upload-btn input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    
    /* Slider Saiz Logo */
    .slider-container { display: flex; flex-direction: column; gap: 8px; }
    input[type=range] { width: 100%; accent-color: #38bdf8; }
    
    /* Butang Save */
    .save-btn {
      margin-top: auto; background: #10b981; color: white; border: none; padding: 15px;
      border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s;
    }
    .save-btn:hover { background: #059669; }

    /* KAWASAN 3D */
    #viewer-container { flex: 1; position: relative; background: radial-gradient(circle, #2a2a35 0%, #121212 100%); }
    #viewer-container canvas { display: block; }
    
    /* UI Overlay (Panduan Drag) */
    #hint {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; font-size: 13px;
      pointer-events: none; opacity: 0; transition: opacity 0.5s;
    }

    /* Loading */
    #loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #121212; color: #38bdf8; z-index: 100; font-weight: 600; letter-spacing: 1px;
    }

    /* Responsive (Mobile) */
    @media (max-width: 768px) {
      #app { flex-direction: column; }
      #sidebar { width: 100%; height: auto; border-right: none; border-top: 1px solid #333; padding: 15px; order: 2; }
      #viewer-container { order: 1; flex: 1; }
      .save-btn { margin-top: 10px; }
      .color-grid { grid-template-columns: repeat(6, 1fr); }
    }
  </style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div>
      <h2>1. Warna Baju</h2>
      <div class="color-grid" id="colorGrid"></div>
    </div>
    
    <div>
      <h2>2. Upload Logo</h2>
      <div class="upload-btn">
        + Pilih Gambar
        <input type="file" id="logoUpload" accept="image/*">
      </div>
    </div>
    
    <div class="slider-container">
      <h2>3. Saiz Logo</h2>
      <input type="range" id="logoSize" min="0.1" max="1.5" step="0.05" value="0.5">
    </div>
    
    <button class="save-btn" onclick="saveImage()">⬇️ Save Design</button>
  </div>
  
  <div id="viewer-container">
    <div id="loading">MEMUATKAN 3D...</div>
    <div id="hint">Klik & Drag logo untuk gerakkan</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ===== DATA WARNA =====
const COLORS = [
  { name: 'Putih', hex: '#ffffff' },
  { name: 'Hitam', hex: '#1a1a1a' },
  { name: 'Kelabu', hex: '#64748b' },
  { name: 'Merah', hex: '#dc2626' },
  { name: 'Biru', hex: '#2563eb' },
  { name: 'Hijau', hex: '#16a34a' },
  { name: 'Kuning', hex: '#ca8a04' },
  { name: 'Ungu', hex: '#9333ea' }
];

// ===== SETUP ASAS THREE.JS =====
const container = document.getElementById('viewer-container');
const scene = new THREE.Scene();
// Kita buang background gelap, guna CSS gradient
scene.background = null; 

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

// ===== LAMPU =====
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 2);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
fillLight.position.set(-5, 5, -5);
scene.add(fillLight);

// ===== KAWALAN KAMERA (ORBIT) =====
const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false;
controls.enableZoom = true;
controls.minDistance = 2;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI / 2 + 0.1; // Hadkan pusing bawah
controls.target.set(0, 0, 0);

// ===== VARIABEL GLOBAL =====
let shirtMesh = null;
let shirtMaterials = [];
let logoMesh = null;
let logoTexture = null;

// ===== LOAD MODEL 3D =====
const loader = new GLTFLoader();
const MODEL_URL = './T_shirt_gltf.gltf'; // Pastikan nama fail betul

loader.load(
  MODEL_URL,
  (gltf) => {
    shirtMesh = gltf.scene;
    
    // 1. Auto-fit size model
    const box = new THREE.Box3().setFromObject(shirtMesh);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxSize = Math.max(size.x, size.y, size.z);
    const scaleFactor = 2.5 / maxSize; 
    
    shirtMesh.scale.set(scaleFactor, scaleFactor, scaleFactor);
    shirtMesh.position.set(-center.x * scaleFactor, -center.y * scaleFactor, -center.z * scaleFactor);
    camera.position.set(0, 0, maxSize * 1.8);
    controls.update();

    // 2. Setup material baju
    shirtMesh.traverse((child) => {
      if (child.isMesh) {
        child.material = new THREE.MeshStandardMaterial({
          color: '#ffffff', roughness: 0.9, metalness: 0.0
        });
        shirtMaterials.push(child.material);
      }
    });
    
    scene.add(shirtMesh);

    // 3. Sediakan tempat (Plane) untuk Logo di depan baju
    setupLogoPlane(box);

    document.getElementById('loading').style.display = 'none';
  },
  undefined,
  (error) => {
    console.error('Error:', error);
    document.getElementById('loading').innerText = 'Gagal muat model.';
  }
);

// ===== LOGIK UNTUK LOGO (PLANE & DRAG) =====
function setupLogoPlane(boundingBox) {
  // Kita buat satu 'plane' lutsinar di depan baju untuk letak logo
  const width = boundingBox.getSize(new THREE.Vector3()).x * 1.5;
  const height = boundingBox.getSize(new THREE.Vector3()).y * 1.5;
  
  const geometry = new THREE.PlaneGeometry(width, height);
  const material = new THREE.MeshBasicMaterial({ 
    transparent: true, 
    opacity: 0, // Lutsinar (tak nampak) tapi boleh diklik
    side: THREE.DoubleSide,
    depthTest: false 
  });
  
  logoMesh = new THREE.Mesh(geometry, material);
  
  // Letak plane ni di depan baju sikit
  logoMesh.position.set(0, 0, 0.6); 
  scene.add(logoMesh);
}

// Event Listener Drag Logo
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let isDragging = false;
let dragPlane = new THREE.Plane();
const dragOffset = new THREE.Vector3();

// Event pointer down
renderer.domElement.addEventListener('pointerdown', (e) => {
  if(!logoTexture || !logoMesh) return; // Kalau takde logo, takyah drag
  
  mouse.x = (e.clientX / renderer.domElement.clientWidth) * 2 - 1;
  mouse.y = -(e.clientY / renderer.domElement.clientHeight) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  
  // Tembak ke arah logo plane
  const intersects = raycaster.intersectObject(logoMesh);
  
  if (intersects.length > 0) {
    isDragging = true;
    controls.enabled = false; // Matikan pusing kamera sementara drag
    
    // Kira offset supaya logo tak lompat
    const intersectPoint = intersects[0].point;
    dragOffset.copy(intersectPoint).sub(logoMesh.position);
    
    // Set plane drag selari dengan skrin
    dragPlane.setFromNormalAndCoplanarPoint(
      camera.getWorldDirection(new THREE.Vector3()).negate(),
      logoMesh.position.clone()
    );
    
    document.getElementById('hint').style.opacity = '1';
  }
});

// Event pointer move
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  
  mouse.x = (e.clientX / renderer.domElement.clientWidth) * 2 - 1;
  mouse.y = -(e.clientY / renderer.domElement.clientHeight) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  
  const intersection = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(dragPlane, intersection)) {
    // Update posisi logo
    logoMesh.position.copy(intersection.sub(dragOffset));
  }
});

// Event pointer up
renderer.domElement.addEventListener('pointerup', () => {
  isDragging = false;
  controls.enabled = true;
  document.getElementById('hint').style.opacity = '0';
});

// ===== UPLOAD LOGO & SAIZ =====
document.getElementById('logoUpload').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      if (logoTexture) logoTexture.dispose(); // Buang texture lama
      
      logoTexture = new THREE.Texture(img);
      logoTexture.needsUpdate = true;
      logoTexture.colorSpace = THREE.SRGBColorSpace;

      // Buat mesh untuk logo
      if (logoMesh.userData.logo) scene.remove(logoMesh.userData.logo);
      
      const aspect = img.width / img.height;
      const baseSize = 0.5; // Saiz asal
      
      const logoGeo = new THREE.PlaneGeometry(baseSize * aspect, baseSize);
      const logoMat = new THREE.MeshBasicMaterial({ 
        map: logoTexture, 
        transparent: true, 
        depthTest: false // Supaya sentiasa nampak di depan baju
      });
      
      const logo3D = new THREE.Mesh(logoGeo, logoMat);
      
      // Letak logo di atas plane kawalan (tengah-tengah)
      logo3D.position.set(0, 0, 0.01); // Sikit ke depan dari plane kawalan
      
      logoMesh.add(logo3D);
      logoMesh.userData.logo = logo3D; // Simpan rujukan

      // Apply saiz semasa
      updateLogoSize();
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
});

// Slider Saiz
document.getElementById('logoSize').addEventListener('input', updateLogoSize);
function updateLogoSize() {
  if (logoMesh && logoMesh.userData.logo) {
    const val = parseFloat(document.getElementById('logoSize').value);
    logoMesh.userData.logo.scale.set(val, val, val);
  }
}

// ===== BINA BUTANG WARNA =====
const colorGrid = document.getElementById('colorGrid');
COLORS.forEach((c, i) => {
  const btn = document.createElement('button');
  btn.className = 'color-btn' + (i === 0 ? ' active' : '');
  btn.style.background = c.hex;
  btn.title = c.name;
  
  btn.addEventListener('click', () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    shirtMaterials.forEach(mat => mat.color.set(c.hex));
  });
  
  colorGrid.appendChild(btn);
});

// ===== SIMPAN GAMBAR =====
window.saveImage = function() {
  // Sembunyikan plane kawalan (supaya tak nampak border)
  if(logoMesh) logoMesh.visible = false;
  
  renderer.render(scene, camera);
  const dataURL = renderer.domElement.toDataURL('image/png');
  
  // Tunjuk balik plane
  if(logoMesh) logoMesh.visible = true;
  
  const link = document.createElement('a');
  link.download = 'design-baju.png';
  link.href = dataURL;
  link.click();
};

// ===== RENDER LOOP =====
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ===== RESPONSIVE =====
window.addEventListener('resize', () => {
  const width = container.clientWidth;
  const height = container.clientHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
});
</script>

</body>
</html>
