<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pro Designer 3D - Studio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #121212; color: #f3f4f6; }
    
    #app { display: flex; height: 100vh; }
    
    #sidebar-left {
      width: 300px; background: #18181b; padding: 20px; display: flex; flex-direction: column; gap: 16px;
      border-right: 1px solid #27272a; z-index: 10; box-shadow: 4px 0 15px rgba(0,0,0,0.3); overflow-y: auto;
    }
    .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: #a1a1aa; margin-bottom: 8px; }
    
    .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .color-btn { aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
    .color-btn:hover { transform: scale(1.1); }
    .color-btn.active { border-color: #38bdf8; transform: scale(1.1); box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    
    .custom-color-wrapper { display: flex; align-items: center; gap: 12px; background: #27272a; padding: 8px 12px; border-radius: 8px; border: 1px solid #3f3f46; margin-top: 8px;}
    .custom-color-wrapper input[type="color"] { width: 32px; height: 32px; border: none; background: none; cursor: pointer; border-radius: 4px; }
    .custom-color-wrapper span { font-size: 13px; color: #d4d4d8; }

    .upload-btn {
      background: #38bdf8; color: #000; text-align: center; padding: 12px; border-radius: 8px;
      font-weight: 600; font-size: 13px; cursor: pointer; position: relative; overflow: hidden; transition: 0.2s;
    }
    .upload-btn:hover { background: #0ea5e9; }
    .upload-btn input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    .text-input-group { display: flex; gap: 6px; margin-bottom: 6px; }
    .text-input-group input[type="text"] { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #3f3f46; background: #27272a; color: #fff; font-family: inherit; font-size: 12px; }
    .text-input-group input[type="color"] { width: 36px; height: 36px; border: none; background: #27272a; border-radius: 6px; cursor: pointer; padding: 2px; }
    .add-text-btn { background: #27272a; color: #d4d4d8; border: 1px solid #3f3f46; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; }
    .add-text-btn:hover { background: #3f3f46; }

    /* Panel Gizmo */
    .gizmo-panel { display: none; background: #27272a; padding: 12px; border-radius: 8px; border: 1px solid #3f3f46; flex-direction: column; gap: 8px; }
    .gizmo-panel.active { display: flex; }
    .mode-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .mode-btn { background: #3f3f46; border: none; color: #d4d4d8; padding: 10px 4px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: inherit; }
    .mode-btn:hover { background: #52525b; }
    .mode-btn.active { background: #38bdf8; color: #000; }
    
    .action-row { display: flex; gap: 8px; margin-top: 4px; }
    .btn-undo { flex: 1; background: #27272a; color: #fff; border: 1px solid #3f3f46; border-radius: 6px; padding: 10px; cursor: pointer; font-weight: 600; font-size: 12px; transition: 0.2s; }
    .btn-undo:hover { background: #3f3f46; }

    .save-btn {
      margin-top: auto; background: #10b981; color: #fff; border: none; padding: 14px;
      border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s;
    }
    .save-btn:hover { background: #059669; }

    #viewer-container { flex: 1; position: relative; background: radial-gradient(circle at center, #27272a 0%, #09090b 100%); overflow: hidden; }
    #viewer-container canvas { display: block; }

    #view-toggles {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; background: rgba(24, 24, 27, 0.8); padding: 8px; border-radius: 12px; backdrop-filter: blur(10px);
    }
    #view-toggles button { background: #3f3f46; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 600; transition: 0.2s; }
    #view-toggles button:hover { background: #52525b; }

    #sidebar-right {
      width: 260px; background: #18181b; border-left: 1px solid #27272a; z-index: 10;
      display: flex; flex-direction: column; box-shadow: -4px 0 15px rgba(0,0,0,0.3);
    }
    #layers-header { padding: 20px 20px 12px 20px; border-bottom: 1px solid #27272a; }
    #layers-header h2 { font-size: 12px; font-weight: 600; color: #e4e4e7; text-transform: uppercase; }
    
    #layers-list { flex: 1; overflow-y: auto; }
    .layer-item { padding: 12px 20px; border-bottom: 1px solid #27272a; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; font-size: 12px; color: #d4d4d8; }
    .layer-item:hover { background: #27272a; }
    .layer-item.active { background: rgba(56, 189, 248, 0.1); border-left: 3px solid #38bdf8; color: #38bdf8; font-weight: 600;}
    .layer-info { display: flex; align-items: center; gap: 10px; }
    
    .delete-btn { color: #ef4444; font-size: 14px; font-weight: bold; opacity: 0; transition: 0.2s; padding: 4px; background: none; border: none; cursor: pointer;}
    .layer-item:hover .delete-btn { opacity: 1; }

    #loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #09090b; color: #38bdf8; z-index: 100; font-weight: 600; letter-spacing: 2px; transition: opacity 0.5s;
    }
  </style>
</head>
<body>

<div id="app">
  <div id="sidebar-left">
    <div>
      <div class="section-title">Warna Baju</div>
      <div class="color-grid" id="colorGrid"></div>
      <div class="custom-color-wrapper">
        <input type="color" id="customColor" value="#ffffff">
        <span>Warna Custom</span>
      </div>
    </div>
    
    <div>
      <div class="section-title">Design Anda</div>
      <div class="upload-btn">
        + Tambah Logo
        <input type="file" id="logoUpload" accept="image/*" multiple>
      </div>
    </div>

    <div>
      <div class="section-title">Tambah Teks</div>
      <div class="text-input-group">
        <input type="text" id="textInput" placeholder="Taip teks...">
        <input type="color" id="textColor" value="#000000">
      </div>
      <button class="add-text-btn" id="addTextBtn">Tambah Teks</button>
    </div>

    <!-- Gizmo Panel (Hanya muncul bila logo dipilih) -->
    <div class="gizmo-panel" id="gizmoPanel">
      <div class="section-title" style="margin-bottom: 0;">Kawalan Logo (3D)</div>
      <div class="mode-buttons">
        <button class="mode-btn active" id="btnTranslate" title="Gerak">✥ Gerak</button>
        <button class="mode-btn" id="btnScale" title="Saiz">⤢ Saiz</button>
        <button class="mode-btn" id="btnRotate" title="Putar">⟳ Putar</button>
      </div>
      <div class="action-row">
        <button class="btn-undo" id="undoBtn">↩ Undo (Ctrl+Z)</button>
      </div>
    </div>
    
    <button class="save-btn" id="saveBtn">⬇️ Simpan Design HD</button>
  </div>
  
  <div id="viewer-container">
    <div id="loading">MEMUATKAN STUDIO...</div>
    <div id="view-toggles">
      <button id="viewFront">Depan</button>
      <button id="viewBack">Belakang</button>
      <button id="viewLeft">Sisi Kiri</button>
      <button id="viewRight">Sisi Kanan</button>
    </div>
  </div>

  <div id="sidebar-right">
    <div id="layers-header"><h2>Senarai Layer</h2></div>
    <div id="layers-list"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ===== 1. SETUP ASAS =====
const container = document.getElementById('viewer-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(0, 0, 4.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const mainLight = new THREE.DirectionalLight(0xffffff, 2);
mainLight.position.set(5, 10, 5);
mainLight.castShadow = true;
scene.add(mainLight);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.ShadowMaterial({ opacity: 0.3 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.2;
ground.receiveShadow = true;
scene.add(ground);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;

// GIZMO KAWALAN
const transformControls = new TransformControls(camera, renderer.domElement);
transformControls.setMode('translate');
transformControls.setSize(0.8);
const transformHelper = transformControls.getHelper();
scene.add(transformHelper);

// KUNCI KAMERA 100% BILA GIZMO DIGUNAKAN
transformControls.addEventListener('dragging-changed', (event) => {
  controls.enabled = !event.value;
  if (!event.value) {
    // Bila selesai tarik, simpan ke memori
    saveToLocalStorage();
    pushHistory();
  }
});

// ===== 2. STATE & MODEL =====
const shirtGroup = new THREE.Group();
scene.add(shirtGroup);

let shirtMeshes = [];
let shirtMaterials = [];
let layers = [];
let activeDummy = null;
let logoCount = 0;

let history = [];
let historyIndex = -1;
let currentShirtColor = '#ffffff';

const raycaster = new THREE.Raycaster();
const layerListUI = document.getElementById('layers-list');
const gizmoPanel = document.getElementById('gizmoPanel');

new GLTFLoader().load('./T_shirt_gltf.gltf', 
  (gltf) => setupShirt(gltf.scene), 
  undefined, 
  (err) => {
    console.error(err);
    document.getElementById('loading').innerText = 'Gagal memuatkan fail baju.';
  }
);

function setupShirt(model) {
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  model.scale.setScalar(2.4 / maxDim);
  model.updateMatrixWorld(true);

  box.setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(center);
  model.updateMatrixWorld(true);

  model.traverse((child) => {
    if (child.isMesh) {
      child.castShadow = true; child.receiveShadow = true;
      const mat = new THREE.MeshStandardMaterial({ color: currentShirtColor, roughness: 0.8, metalness: 0.1 });
      child.material = mat;
      shirtMaterials.push(mat);
      shirtMeshes.push(child);
    }
  });

  shirtGroup.add(model);
  ground.position.y = box.min.y - 0.1;

  finishLoading();
  addBaseLayer();
  loadFromLocalStorage();
}

function finishLoading() {
  const el = document.getElementById('loading');
  el.style.opacity = '0';
  setTimeout(() => el.remove(), 500);
}

// ===== 3. SISTEM LAYER =====
function addBaseLayer() {
  const el = document.createElement('div');
  el.className = 'layer-item active';
  el.innerHTML = `<div class="layer-info"><span>👕</span> <span>Baju 3D (Asas)</span></div>`;
  el.onclick = () => {
    deselectAll();
    el.classList.add('active');
  };
  layerListUI.appendChild(el);
}

function addDesignLayer(dummy, name, icon) {
  const id = 'layer-' + Date.now() + Math.random().toString(36).substr(2, 5);
  dummy.userData.layerId = id;

  const el = document.createElement('div');
  el.className = 'layer-item';
  el.id = id;
  
  el.innerHTML = `
    <div class="layer-info"><span>${icon}</span> <span>${name}</span></div>
    <button class="delete-btn" title="Padam">✕</button>
  `;

  el.onclick = (e) => {
    if (e.target.closest('.delete-btn')) return;
    selectLayer(dummy, el);
  };

  el.querySelector('.delete-btn').onclick = (e) => {
    e.stopPropagation();
    deleteLayer(dummy, el);
    saveToLocalStorage();
    pushHistory();
  };

  layerListUI.prepend(el);
  selectLayer(dummy, el);
}

function deselectAll() {
  activeDummy = null;
  transformControls.detach();
  gizmoPanel.classList.remove('active');
  document.querySelectorAll('.layer-item').forEach(i => i.classList.remove('active'));
}

function selectLayer(dummy, el) {
  deselectAll();
  el.classList.add('active');
  activeDummy = dummy;
  transformControls.attach(dummy);
  gizmoPanel.classList.add('active');
}

function deleteLayer(dummy, el) {
  deselectAll();
  if (dummy.userData.decals) {
    dummy.userData.decals.forEach(decal => {
      shirtGroup.remove(decal);
      decal.geometry.dispose();
      if (decal.material.map) decal.material.map.dispose();
      decal.material.dispose();
    });
  }
  if (dummy.userData.texture) dummy.userData.texture.dispose();
  shirtGroup.remove(dummy);
  el.remove();
  layers = layers.filter(l => l !== dummy);
}

// ===== 4. SISTEM DECAL (DIPERBAIKI UNTUK LENGAN) =====
function createDecal(dummy) {
  if (!shirtMeshes.length) return;

  if (dummy.userData.decals) {
    dummy.userData.decals.forEach(decal => {
      shirtGroup.remove(decal);
      decal.geometry.dispose();
      if (decal.material.map) decal.material.map.dispose();
      decal.material.dispose();
    });
  }
  dummy.userData.decals = [];

  const w = 0.6 * dummy.scale.x;
  const h = (0.6 / dummy.userData.aspect) * dummy.scale.y;
  
  // PENTING: Tukar kedalaman (Z) dari 0.2 ke 0.01 supaya tak menembusi lengan
  const size = new THREE.Vector3(w, h, 0.01); 

  const currentNormal = new THREE.Vector3(0, 0, 1).applyQuaternion(dummy.quaternion);
  const isBack = currentNormal.z < -0.1;
  
  const rotAngle = dummy.userData.rotate || 0;
  const userRotQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), THREE.MathUtils.degToRad(rotAngle));
  const finalQuat = dummy.quaternion.clone().multiply(userRotQ);

  shirtMeshes.forEach(mesh => {
    try {
      const decalGeo = new DecalGeometry(mesh, dummy.position, finalQuat, size);
      
      if (decalGeo.attributes.position && decalGeo.attributes.position.count > 0) {
        const tex = dummy.userData.texture.clone();
        if (isBack) { tex.wrapS = THREE.RepeatWrapping; tex.repeat.x = -1; }

        const decalMat = new THREE.MeshStandardMaterial({
          map: tex, transparent: true, depthTest: true, depthWrite: false,
          polygonOffset: true, polygonOffsetFactor: -4, roughness: 0.8
        });

        const decalMesh = new THREE.Mesh(decalGeo, decalMat);
        decalMesh.renderOrder = 2;
        shirtGroup.add(decalMesh);
        dummy.userData.decals.push(decalMesh);
      } else {
        decalGeo.dispose();
      }
    } catch(e) {}
  });
}

// Setiap kali Gizmo digerakkan, kemas kini posisi & decal
transformControls.addEventListener('objectChange', () => {
  if (!activeDummy || !shirtMeshes.length) return;

  activeDummy.updateMatrixWorld();
  const worldPos = new THREE.Vector3().setFromMatrixPosition(activeDummy.matrixWorld);
  
  // Snap posisi ke permukaan baju (Raycast)
  const dir = worldPos.clone().sub(camera.position).normalize();
  raycaster.set(camera.position, dir);
  const hits = raycaster.intersectObjects(shirtMeshes, true);
  
  if (hits.length > 0) {
    const hit = hits[0];
    activeDummy.position.copy(shirtGroup.worldToLocal(hit.point.clone()));

    // Jika mod 'Gerak' atau 'Putar', pastikan ia ikut bentuk baju
    if (transformControls.getMode() === 'translate') {
      const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
      const localNormal = normal.clone().transformDirection(new THREE.Matrix4().copy(shirtGroup.matrixWorld).invert()).normalize();
      activeDummy.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), localNormal);
    }
  }

  createDecal(activeDummy);
});

// ===== 5. TAMBAH LOGO & TEKS =====
document.getElementById('logoUpload').addEventListener('change', (e) => {
  const files = e.target.files;
  if(!files.length) return;
  for(let i=0; i<files.length; i++) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX_SIZE = 512;
        let width = img.width, height = img.height;
        if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
        else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const texture = new THREE.Texture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.needsUpdate = true;
        addLogoToScene(texture, width / height, false, ev.target.result);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(files[i]);
  }
  e.target.value = '';
});

document.getElementById('addTextBtn').onclick = () => {
  const text = document.getElementById('textInput').value;
  const color = document.getElementById('textColor').value;
  if (!text) return;

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 1024; canvas.height = 256;
  ctx.fillStyle = color;
  ctx.font = "bold 120px Inter, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, 512, 128);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  addLogoToScene(texture, canvas.width / canvas.height, true, canvas.toDataURL());
  document.getElementById('textInput').value = '';
};

function addLogoToScene(texture, aspect, isText = false, base64 = null, posArray = null, quatArray = null, scaleArray = null, rot = 0) {
  const dummy = new THREE.Object3D();
  dummy.userData.texture = texture;
  dummy.userData.aspect = aspect;
  dummy.userData.isText = isText;
  dummy.userData.base64 = base64;
  dummy.userData.rotate = rot;
  
  shirtGroup.add(dummy);
  logoCount++;

  if (posArray && quatArray && scaleArray) {
    dummy.position.fromArray(posArray);
    dummy.quaternion.fromArray(quatArray);
    dummy.scale.fromArray(scaleArray);
  } else {
    const offsetX = (logoCount % 2 === 0) ? 0.15 : -0.15;
    const offsetY = Math.floor(logoCount / 2) * -0.2;
    raycaster.setFromCamera(new THREE.Vector2(offsetX, offsetY), camera);
    const hits = raycaster.intersectObjects(shirtMeshes, true);

    if (hits.length > 0) {
      const hit = hits[0];
      dummy.position.copy(shirtGroup.worldToLocal(hit.point.clone()));
      const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
      const localNormal = normal.clone().transformDirection(new THREE.Matrix4().copy(shirtGroup.matrixWorld).invert()).normalize();
      dummy.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), localNormal);
    } else {
      dummy.position.set(0, 0, 0.5);
    }
  }

  createDecal(dummy);
  layers.push(dummy);

  const layerName = isText ? `Teks` : `Logo ${logoCount}`;
  const icon = isText ? '📝' : '🖼️';
  addDesignLayer(dummy, layerName, icon);
  
  if(!posArray) {
    saveToLocalStorage();
    pushHistory();
  }
}

// ===== 6. SIMPAN, MUAT & UNDO =====
function saveToLocalStorage() {
  const state = layers.map(l => ({
    isText: l.userData.isText, base64: l.userData.base64, aspect: l.userData.aspect,
    pos: l.position.toArray(), quat: l.quaternion.toArray(), scale: l.scale.toArray(), rot: l.userData.rotate || 0
  }));
  localStorage.setItem('shirtDesignLayers', JSON.stringify(state));
  localStorage.setItem('shirtColor', currentShirtColor);
}

function loadFromLocalStorage() {
  const savedColor = localStorage.getItem('shirtColor');
  if (savedColor) {
    currentShirtColor = savedColor;
    shirtMaterials.forEach(m => m.color.set(savedColor));
  }

  const saved = localStorage.getItem('shirtDesignLayers');
  if (!saved) return;
  try {
    const state = JSON.parse(saved);
    state.forEach(item => {
      const img = new Image();
      img.onload = () => {
        const texture = new THREE.Texture(img);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.needsUpdate = true;
        addLogoToScene(texture, item.aspect, item.isText, item.base64, item.pos, item.quat, item.scale, item.rot);
      };
      img.src = item.base64;
    });
  } catch(e) {}
}

function pushHistory() {
  const state = layers.map(l => ({
    isText: l.userData.isText, base64: l.userData.base64, aspect: l.userData.aspect,
    pos: l.position.toArray(), quat: l.quaternion.toArray(), scale: l.scale.toArray(), rot: l.userData.rotate || 0
  }));
  history = history.slice(0, historyIndex + 1);
  history.push(JSON.stringify(state));
  historyIndex++;
}

document.getElementById('undoBtn').onclick = () => {
  if (historyIndex <= 0) return;
  historyIndex--;
  restoreState(JSON.parse(history[historyIndex]));
};

window.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
    e.preventDefault();
    document.getElementById('undoBtn').click();
  }
});

function restoreState(state) {
  layers.forEach(l => {
    if (l.userData.decals) {
      l.userData.decals.forEach(d => { shirtGroup.remove(d); d.geometry.dispose(); d.material.dispose(); });
    }
    shirtGroup.remove(l);
    if(l.userData.layerId) { const el = document.getElementById(l.userData.layerId); if(el) el.remove(); }
  });
  layers = [];
  logoCount = 0;
  deselectAll();

  state.forEach(item => {
    const img = new Image();
    img.onload = () => {
      const texture = new THREE.Texture(img);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;
      addLogoToScene(texture, item.aspect, item.isText, item.base64, item.pos, item.quat, item.scale, item.rot);
    };
    img.src = item.base64;
  });
}

// ===== 7. KAWALAN UI LAIN =====
document.getElementById('btnTranslate').onclick = (e) => {
  transformControls.setMode('translate');
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
};
document.getElementById('btnScale').onclick = (e) => {
  transformControls.setMode('scale');
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
};
document.getElementById('btnRotate').onclick = (e) => {
  transformControls.setMode('rotate');
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
};

const colors = ['#ffffff', '#171717', '#64748b', '#dc2626', '#2563eb', '#16a34a', '#ca8a04', '#9333ea'];
const colorGrid = document.getElementById('colorGrid');
colors.forEach((hex, i) => {
  const btn = document.createElement('button');
  btn.className = 'color-btn' + (hex === currentShirtColor ? ' active' : '');
  btn.style.background = hex;
  btn.onclick = () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentShirtColor = hex;
    shirtMaterials.forEach(m => m.color.set(hex));
    saveToLocalStorage();
  };
  colorGrid.appendChild(btn);
});

document.getElementById('customColor').addEventListener('input', (e) => {
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
  currentShirtColor = e.target.value;
  shirtMaterials.forEach(m => m.color.set(currentShirtColor));
  saveToLocalStorage();
});

// PANDANGAN KAMERA (Depan, Belakang, Kiri, Kanan)
document.getElementById('viewFront').onclick = () => { camera.position.set(0, 0, 4.5); controls.target.set(0, 0, 0); };
document.getElementById('viewBack').onclick = () => { camera.position.set(0, 0, -4.5); controls.target.set(0, 0, 0); };
document.getElementById('viewLeft').onclick = () => { camera.position.set(-4.5, 0, 0); controls.target.set(0, 0, 0); };
document.getElementById('viewRight').onclick = () => { camera.position.set(4.5, 0, 0); controls.target.set(0, 0, 0); };

document.getElementById('saveBtn').onclick = () => {
  const currentSize = renderer.getSize(new THREE.Vector2());
  renderer.setSize(2000, 2000, false);
  renderer.render(scene, camera);
  const dataURL = renderer.domElement.toDataURL('image/png');
  renderer.setSize(currentSize.x, currentSize.y, false);
  renderer.render(scene, camera);

  const link = document.createElement('a');
  link.download = 'design-baju-hd.png';
  link.href = dataURL;
  link.click();
};

// ===== 8. RENDER LOOP =====
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const width = container.clientWidth;
  const height = container.clientHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
});
</script>

</body>
</html>
