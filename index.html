<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pro Designer 3D</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #121212; color: #fff; }
    
    #app { display: flex; height: 100vh; }
    
    /* PANEL KIRI (TOOLS) */
    #sidebar-left {
      width: 250px; background: #1e1e24; padding: 20px; display: flex; flex-direction: column; gap: 20px;
      border-right: 1px solid #333; z-index: 10;
    }
    h2 { font-size: 12px; text-transform: uppercase; color: #888; margin-bottom: 10px; letter-spacing: 1px;}
    
    .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .color-btn { aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: 0.2s; }
    .color-btn:hover, .color-btn.active { border-color: #38bdf8; transform: scale(1.1); }
    
    .upload-btn {
      background: #38bdf8; color: #000; text-align: center; padding: 12px; border-radius: 6px;
      font-weight: 600; cursor: pointer; position: relative; overflow: hidden;
    }
    .upload-btn input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    
    .save-btn {
      margin-top: auto; background: #10b981; color: white; border: none; padding: 15px;
      border-radius: 6px; font-weight: bold; cursor: pointer;
    }

    /* KAWASAN 3D */
    #viewer-container { flex: 1; position: relative; background: radial-gradient(circle, #2a2a35 0%, #121212 100%); }
    #viewer-container canvas { display: block; }

    /* PANEL KANAN (LAYERS) */
    #sidebar-right {
      width: 220px; background: #1e1e24; border-left: 1px solid #333; z-index: 10; display: flex; flex-direction: column;
    }
    #sidebar-right h2 { padding: 15px; border-bottom: 1px solid #333; margin: 0; }
    #layers-list { flex: 1; overflow-y: auto; }
    
    .layer-item {
      padding: 12px 15px; border-bottom: 1px solid #2a2a35; cursor: pointer; display: flex; align-items: center; gap: 10px;
      transition: 0.2s; font-size: 13px;
    }
    .layer-item:hover { background: #2a2a35; }
    .layer-item.active { background: #0ea5e9; color: #fff; }
    .layer-icon { font-size: 16px; }

    #loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #121212; color: #38bdf8; z-index: 100; font-weight: 600;
    }

    @media (max-width: 900px) {
      #app { flex-direction: column; }
      #sidebar-left { width: 100%; height: auto; flex-direction: row; border-right: none; border-bottom: 1px solid #333; padding: 10px;}
      #sidebar-left h2 { display: none; }
      #sidebar-right { width: 100%; height: 150px; border-left: none; border-top: 1px solid #333; }
      #sidebar-right h2 { display: none; }
      .layer-item { border-right: 1px solid #333; border-bottom: none; }
    }
  </style>
</head>
<body>

<div id="app">
  <!-- KIRI: KAWALAN -->
  <div id="sidebar-left">
    <div>
      <h2>Warna Baju</h2>
      <div class="color-grid" id="colorGrid"></div>
    </div>
    <div>
      <h2>Design</h2>
      <div class="upload-btn">
        + Upload Logo
        <input type="file" id="logoUpload" accept="image/*" multiple>
      </div>
    </div>
    <button class="save-btn" onclick="saveImage()">Save Design</button>
  </div>
  
  <!-- TENGAH: 3D VIEWER -->
  <div id="viewer-container">
    <div id="loading">MEMUATKAN 3D...</div>
  </div>

  <!-- KANAN: LAYERS -->
  <div id="sidebar-right">
    <h2>Layers</h2>
    <div id="layers-list"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

// ===== SETUP ASAS =====
const container = document.getElementById('viewer-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

// Lampu Studio
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dirLight = new THREE.DirectionalLight(0xffffff, 2);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
fillLight.position.set(-5, 5, -5);
scene.add(fillLight);

// Kawalan Kamera
const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false;
controls.minDistance = 2;
controls.maxDistance = 10;

// ===== GIZMO KAWALAN =====
const transformControls = new TransformControls(camera, renderer.domElement);
transformControls.setMode('translate');
transformControls.showZ = false; // Kunci Z supaya tak terapung
scene.add(transformControls);

transformControls.addEventListener('dragging-changed', (event) => {
  controls.enabled = !event.value;
});

// ===== SISTEM LAYER & GROUP =====
const shirtGroup = new THREE.Group(); // Induk untuk baju & logo
scene.add(shirtGroup);

let shirtMesh = null;
let shirtMaterials = [];
let activeLayerObject = null;

// Data Layer
const layers = [];
const layerListUI = document.getElementById('layers-list');

// ===== LOAD MODEL 3D =====
const loader = new GLTFLoader();
loader.load('./T_shirt_gltf.gltf', (gltf) => {
  shirtMesh = gltf.scene;
  
  // Auto-fit
  const box = new THREE.Box3().setFromObject(shirtMesh);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxSize = Math.max(size.x, size.y, size.z);
  const scale = 2.5 / maxSize;
  
  shirtMesh.scale.set(scale, scale, scale);
  shirtMesh.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
  
  // Kamera
  camera.position.set(0, 0, 4);
  controls.update();

  // Material
  shirtMesh.traverse((child) => {
    if (child.isMesh) {
      child.material = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.8 });
      shirtMaterials.push(child.material);
    }
  });
  
  shirtGroup.add(shirtMesh);
  document.getElementById('loading').style.display = 'none';

  // Daftar Layer Baju 3D
  addLayer('Baju 3D', '👕', shirtGroup, true);

}, undefined, (err) => {
  document.getElementById('loading').innerText = 'Gagal load baju.';
});

// ===== FUNGSI LAYER UI =====
function addLayer(name, icon, object, isShirt = false) {
  const id = 'layer-' + Date.now() + Math.random().toString(36).substr(2, 5);
  object.userData.layerId = id;
  
  layers.push({ id, name, object, isShirt });

  const el = document.createElement('div');
  el.className = 'layer-item';
  el.id = id;
  el.innerHTML = `<span class="layer-icon">${icon}</span> <span>${name}</span>`;
  
  el.addEventListener('click', () => {
    document.querySelectorAll('.layer-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    
    // Pilih objek untuk Gizmo
    activeLayerObject = object;
    transformControls.attach(activeLayerObject);
  });

  // Letak layer baru di paling atas
  layerListUI.insertBefore(el, layerListUI.firstChild);
  
  // Auto-klik layer baru
  el.click();
}

// ===== UPLOAD LOGO =====
document.getElementById('logoUpload').addEventListener('change', (e) => {
  const files = e.target.files;
  for (let i = 0; i < files.length; i++) {
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        createLogo(event.target.result, `Logo ${layers.length}`);
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(files[i]);
  }
  e.target.value = '';
});

function createLogo(imageUrl, name) {
  const texture = new THREE.TextureLoader().load(imageUrl);
  texture.colorSpace = THREE.SRGBColorSpace;

  const aspect = texture.image.width / texture.image.height;
  const geo = new THREE.PlaneGeometry(0.5, 0.5 / aspect);
  const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthTest: false, depthWrite: false });
  
  const logo = new THREE.Mesh(geo, mat);

  // TEKNIK RAYCAST: Tembak laser ke tengah baju untuk dapatkan posisi tepat
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera); // Tengah skrin
  
  const intersects = raycaster.intersectObject(shirtMesh, true);

  if (intersects.length > 0) {
    // Letak tepat pada titik terkena laser
    logo.position.copy(intersects[0].point);
    // Anjak sikit ke depan supaya tak tenggelam dalam baju
    logo.position.z += 0.05; 
    // Naik sikit ke arah dada
    logo.position.y += 0.2;
  } else {
    logo.position.set(0, 0, 1); // Fallback
  }

  // Masukkan dalam group baju
  shirtGroup.add(logo);
  
  // Daftar Layer
  addLayer(name, '🖼️', logo, false);
}

// ===== TUKAR WARNA =====
const colors = ['#ffffff', '#1a1a1a', '#dc2626', '#2563eb', '#16a34a', '#eab308'];
const colorGrid = document.getElementById('colorGrid');
colors.forEach((hex, i) => {
  const btn = document.createElement('button');
  btn.className = 'color-btn' + (i === 0 ? ' active' : '');
  btn.style.background = hex;
  btn.onclick = () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    shirtMaterials.forEach(mat => mat.color.set(hex));
  };
  colorGrid.appendChild(btn);
});

// ===== SAVE & RENDER =====
window.saveImage = () => {
  transformControls.visible = false;
  renderer.render(scene, camera);
  const link = document.createElement('a');
  link.download = 'design.png';
  link.href = renderer.domElement.toDataURL('image/png');
  link.click();
  transformControls.visible = true;
};

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>
</body>
</html>
