<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pro Designer 3D - Studio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto:wght@400;700&family=Oswald:wght@400;600&family=Playfair+Display:wght@400;700&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;font-family:Inter,sans-serif;background:#121212;color:#f3f4f6}
    #app{display:flex;height:100vh}
    #sidebar-left{width:300px;background:#18181b;padding:14px;display:flex;flex-direction:column;gap:8px;border-right:1px solid #27272a;z-index:10;overflow-y:auto}
    .accordion-item{background:#1f1f23;border:1px solid #2e2e32;border-radius:8px;overflow:hidden}
    .accordion-header{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:#d4d4d8}
    .accordion-header:hover{background:#27272a}
    .accordion-header .arrow{transition:transform .25s;font-size:10px;color:#71717a}
    .accordion-item.open .accordion-header .arrow{transform:rotate(180deg)}
    .accordion-body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 12px}
    .accordion-item.open .accordion-body{max-height:900px;padding:10px 12px 14px}
    .color-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
    .color-btn{aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.2s}
    .color-btn:hover{transform:scale(1.1)}
    .color-btn.active{border-color:#38bdf8;transform:scale(1.1)}
    .custom-color-wrapper{display:flex;align-items:center;gap:10px;background:#27272a;padding:8px 12px;border-radius:8px;border:1px solid #3f3f46;margin-top:8px}
    .custom-color-wrapper input[type=color]{width:28px;height:28px;border:none;background:none;cursor:pointer}
    .custom-color-wrapper span{font-size:13px;color:#d4d4d8}
    .upload-btn{background:#38bdf8;color:#000;text-align:center;padding:11px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;position:relative;overflow:hidden}
    .upload-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
    .add-text-btn,.small-btn,.action-btn,.preview-btn,.video-btn,.save-btn,.project-btn,.align-btn{border:none;border-radius:6px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
    .add-text-btn{background:#27272a;color:#d4d4d8;border:1px solid #3f3f46;padding:10px;font-size:13px;width:100%}
    .add-text-btn:hover{background:#3f3f46}
    .gizmo-controls{display:none;background:#1f1f23;padding:12px;border-radius:8px;border:1px solid #2e2e32}
    .gizmo-controls.active{display:block}
    .mode-buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
    .mode-btn{background:#3f3f46;border:none;color:#d4d4d8;padding:9px 4px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
    .mode-btn.active{background:#38bdf8;color:#000}
    .mode-btn.free{grid-column:1/-1;background:#7c3aed;color:#fff}
    .action-row{display:flex;gap:6px;margin-top:8px}
    .action-btn{flex:1;background:#3f3f46;color:#d4d4d8;border:1px solid #52525b;padding:9px;font-size:12px}
    .action-btn:disabled{opacity:.4;cursor:not-allowed}
    .save-btn{margin-top:10px;background:#10b981;color:#fff;padding:13px;font-size:14px;width:100%}
    .slider-row{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
    .slider-row label{font-size:12px;color:#d4d4d8;display:flex;justify-content:space-between}
    .slider-row input[type=range]{width:100%;accent-color:#38bdf8;cursor:pointer}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#d4d4d8;margin:6px 0}
    .toggle-switch{position:relative;width:42px;height:22px;background:#3f3f46;border-radius:11px;cursor:pointer}
    .toggle-switch.active{background:#38bdf8}
    .toggle-switch::after{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s}

    .fill-btn.active{background:#38bdf8;color:#000}
    .video-btn{background:#7c3aed;color:#fff;padding:11px;font-size:13px;width:100%}
    .video-btn.recording{background:#dc2626}
    .preview-btn{background:#0ea5e9;color:#fff;padding:10px;font-size:13px;width:100%;margin-bottom:6px}
    .preview-btn.playing{background:#f59e0b}

    .project-btn.secondary{background:#3f3f46;color:#d4d4d8}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

document.querySelectorAll('.accordion-header').forEach(header => {

    header.parentElement.classList.toggle('open');

// ===== INDEXEDDB =====
const DB_NAME = 'ProDesigner3D_v5';
const DB_VERSION = 1;
const STORE = 'projects';

function openDB() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function dbSave(project) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const store = tx.objectStore(STORE);
    const req = ('id' in project && project.id != null) ? store.put(project) : store.add(project);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbGetAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(STORE, 'readonly').objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function dbDelete(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function resizeDataURL(dataURL, max = 900) {
  return new Promise(resolve => {
    if (!dataURL || dataURL.length < 150000) return resolve(dataURL);
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w <= max && h <= max) return resolve(dataURL);
      const r = Math.min(max / w, max / h);
      w = Math.round(w * r); h = Math.round(h * r);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/png'));
    };
    img.onerror = () => resolve(dataURL);
    img.src = dataURL;
  });
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isError ? 'error' : '';
  t.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.style.display = 'none', 2800);
}

async function ensureFontLoaded(font) {
  try { await document.fonts.load(`bold 120px "${font}"`); } catch (e) {}

function createFallbackShirt() {
  const g = new THREE.Group();
  const m = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, metalness: 0.1, side: THREE.DoubleSide });
  const torso = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.8, 0.35), m); torso.position.y = 0.1; torso.castShadow = true; g.add(torso);
  const sl = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.45, 0.35), m); sl.position.set(-0.95, 0.65, 0); sl.castShadow = true; g.add(sl);
  const sr = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.45, 0.35), m); sr.position.set(0.95, 0.65, 0); sr.castShadow = true; g.add(sr);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 0.25, 16), m); neck.position.y = 1.05; neck.castShadow = true; g.add(neck);
  return g;

function setupShirt(model) {
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  model.scale.setScalar(2.4 / maxDim);
  model.updateMatrixWorld(true);
  box.setFromObject(model);
  model.position.sub(box.getCenter(new THREE.Vector3()));
  model.updateMatrixWorld(true);

  model.traverse(c => {
    if (c.isMesh) {
      c.castShadow = c.receiveShadow = true;
      if (!c.material?.isMeshStandardMaterial) c.material = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, metalness: 0.1 });
      else { c.material.color.set(0xffffff); c.material.roughness = 0.8; c.material.metalness = 0.1; }
      shirtMaterials.push(c.material);
      shirtMeshes.push(c);
    }
  });
  shirtGroup.add(model);
  ground.position.y = box.min.y - 0.1;
  const loadingEl = document.getElementById('loading');
  if (loadingEl) { loadingEl.style.opacity = '0'; setTimeout(() => loadingEl.remove(), 400); }
  addBaseLayer();
  loadProjectList().then(loadLastProject);
  pushHistory();
}

// ===== DECAL SYSTEM (flat + curved) =====
const SHIRT_BASE_SIZE = 0.58;
const SLEEVE_BASE_SIZE = 0.92;
function isOnSleeve(d) { return Math.abs(d.position.x) > 0.34; }

let decalQueuedDummy = null;
let decalQueued = false;
function scheduleDecal(dummy) {
  decalQueuedDummy = dummy;
  if (decalQueued) return;
  decalQueued = true;
  requestAnimationFrame(() => {
    decalQueued = false;
    if (decalQueuedDummy) createDecalNow(decalQueuedDummy);
    decalQueuedDummy = null;
  });
}

function getDecalTexture(dummy, isBack) {
  if (!dummy.userData.texture) return null;
  if (isBack) {
    if (!dummy.userData._decalTexBack || dummy.userData._decalTexBackSrc !== dummy.userData.texture) {
      dummy.userData._decalTexBack?.dispose?.();
      const t = dummy.userData.texture.clone();
      t.wrapS = THREE.RepeatWrapping; t.repeat.x = -1; t.needsUpdate = true;
      dummy.userData._decalTexBack = t;
      dummy.userData._decalTexBackSrc = dummy.userData.texture;
    }
    return dummy.userData._decalTexBack;
  }
  if (!dummy.userData._decalTexFront || dummy.userData._decalTexFrontSrc !== dummy.userData.texture) {
    dummy.userData._decalTexFront?.dispose?.();
    dummy.userData._decalTexFront = dummy.userData.texture;
    dummy.userData._decalTexFrontSrc = dummy.userData.texture;
  }
  return dummy.userData._decalTexFront;
}

function createDecalNow(dummy) {
  if (!shirtMeshes.length || dummy.userData.isBg || !dummy.userData.texture) return;
  disposeDummyDecals(dummy);
  const curve = Math.max(0, Math.min(1, dummy.userData.curve || 0));
  if (curve > 0.01) createCurvedDecal(dummy, curve);
  else createFlatDecal(dummy);
}

// Flat decal — using DecalGeometry (original approach, for torso)
function createFlatDecal(dummy) {
  const onSleeve = isOnSleeve(dummy);
  const base = onSleeve ? SLEEVE_BASE_SIZE : SHIRT_BASE_SIZE;
  const depth = onSleeve ? 0.38 : 0.22;
  const w = base * dummy.scale.x;
  const h = (base / (dummy.userData.aspect || 1)) * dummy.scale.y;
  const size = new THREE.Vector3(w, h, depth);
  const isBack = new THREE.Vector3(0, 0, 1).applyQuaternion(dummy.quaternion).z < -0.15;
  const tex = getDecalTexture(dummy, isBack);

  shirtMeshes.forEach(mesh => {
    try {
      const geo = new DecalGeometry(mesh, dummy.position, dummy.quaternion, size);
      if (geo.attributes.position?.count > 0) {
        const mat = new THREE.MeshStandardMaterial({
          map: tex, transparent: true, depthTest: true, depthWrite: false,
          polygonOffset: true, polygonOffsetFactor: -4, roughness: 0.8,
          opacity: dummy.userData.opacity || 1
        });
        const m = new THREE.Mesh(geo, mat);
        m.renderOrder = 2;
        m.visible = dummy.userData.visible !== false;
        shirtGroup.add(m);
        dummy.userData.decals.push(m);
      } else geo.dispose();
    } catch (e) {}
  });
}

// Curved decal — cylindrical arc that follows sleeve, keeps image shape intact
function createCurvedDecal(dummy, curve) {
  const onSleeve = isOnSleeve(dummy);
  const base = onSleeve ? SLEEVE_BASE_SIZE : SHIRT_BASE_SIZE;
  const w = base * dummy.scale.x;
  const h = (base / (dummy.userData.aspect || 1)) * dummy.scale.y;

  const segX = Math.max(16, Math.min(64, Math.round(32 * Math.max(1, w * 2))));
  const segY = 4;
  const geo = new THREE.PlaneGeometry(w, h, segX, segY);
  const pos = geo.attributes.position;

  const halfW = w / 2;
  const maxAngle = (Math.PI / 2) * curve * 0.75;
  const sinA = Math.sin(maxAngle);
  const arcRadius = halfW / Math.max(0.001, sinA);
  
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const u = x / halfW;
    const angle = u * maxAngle;
    const newX = Math.sin(angle) * arcRadius;
    // Fix: Bahagian tengah kekal di Z=0 (melekat pada baju), tepi melengkung ke dalam (Z negatif)
    const newZ = (Math.cos(angle) - 1) * arcRadius; 
    pos.setX(i, newX);
    pos.setZ(i, newZ);
  }
  geo.computeVertexNormals();

  const isBack = new THREE.Vector3(0, 0, 1).applyQuaternion(dummy.quaternion).z < -0.15;
  const tex = getDecalTexture(dummy, isBack);

  const mat = new THREE.MeshStandardMaterial({
    map: tex, transparent: true, depthTest: true, depthWrite: false,
    polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -8,
    roughness: 0.8, opacity: dummy.userData.opacity || 1,
    side: THREE.DoubleSide
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(dummy.position);
  
  // Tolak sedikit ke luar (0.005) supaya tepi yang melengkung tidak menembusi baju
  const localNormal = new THREE.Vector3(0, 0, 1).applyQuaternion(dummy.quaternion);
  mesh.position.add(localNormal.multiplyScalar(0.005));

  mesh.quaternion.copy(dummy.quaternion);
  mesh.renderOrder = 2;
  mesh.visible = dummy.userData.visible !== false;
  shirtGroup.add(mesh);
  dummy.userData.decals.push(mesh);
}

// Update decal on transform drag
transformControls.addEventListener('objectChange', () => {
  if (!activeDummy || activeDummy.userData.locked) return;
  if (activeDummy.userData.isBg) {
    document.getElementById('bgScaleSlider').value = activeDummy.scale.x;
    document.getElementById('bgScaleValue').textContent = activeDummy.scale.x.toFixed(2);
    document.getElementById('propScale').value = activeDummy.scale.x;
    document.getElementById('propScaleValue').textContent = activeDummy.scale.x.toFixed(2);
    return;
  }
  if (transformControls.getMode() === 'scale') {
    const s = Math.max(activeDummy.scale.x, activeDummy.scale.y, activeDummy.scale.z);
    activeDummy.scale.setScalar(Math.max(0.12, Math.min(s, 4.5)));
    document.getElementById('propScale').value = activeDummy.scale.x;
    document.getElementById('propScaleValue').textContent = activeDummy.scale.x.toFixed(2);
  }
  if (transformControls.getMode() === 'translate') {
    activeDummy.updateMatrixWorld();
    const worldPos = new THREE.Vector3().setFromMatrixPosition(activeDummy.matrixWorld);
    raycaster.set(camera.position, worldPos.clone().sub(camera.position).normalize());
    const hits = raycaster.intersectObjects(shirtMeshes, true);
    if (hits.length) {
      const hit = hits[0];
      activeDummy.position.copy(shirtGroup.worldToLocal(hit.point.clone()));
      if (isDragging) {
        const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
        const ln = n.clone().transformDirection(new THREE.Matrix4().copy(shirtGroup.matrixWorld).invert()).normalize();
        const up = new THREE.Vector3(0, 1, 0);
        let right = new THREE.Vector3().crossVectors(up, ln);
        if (right.lengthSq() < 0.001) right.set(1, 0, 0);
        right.normalize();
        const actualUp = new THREE.Vector3().crossVectors(ln, right).normalize();
        activeDummy.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(right, actualUp, ln));
      }
    }
  }
  scheduleDecal(activeDummy);
  if (currentMode === 'free') updateFreeTransformHandles();
});

// ===== FREE TRANSFORM =====
function showFreeTransform() { if (activeDummy && !activeDummy.userData.locked) { ftEl.classList.add('active'); updateFreeTransformHandles(); } }
function hideFreeTransform() { ftEl.classList.remove('active'); ftDragging = null; }
function getLogoCorners(d) {
  if (d.userData.isBg) {
    const b = new THREE.Box3().setFromObject(d);
    return [new THREE.Vector3(b.min.x, b.max.y, b.min.z), new THREE.Vector3(b.max.x, b.max.y, b.min.z), new THREE.Vector3(b.max.x, b.min.y, b.min.z), new THREE.Vector3(b.min.x, b.min.y, b.min.z)];
  }
  const base = isOnSleeve(d) ? SLEEVE_BASE_SIZE : SHIRT_BASE_SIZE;
  const hw = base * d.scale.x * 0.5, hh = (base / (d.userData.aspect || 1)) * d.scale.y * 0.5;
  const cs = [new THREE.Vector3(-hw, hh, 0), new THREE.Vector3(hw, hh, 0), new THREE.Vector3(hw, -hh, 0), new THREE.Vector3(-hw, -hh, 0)];
  d.updateMatrixWorld(true);
  return cs.map(c => c.applyMatrix4(d.matrixWorld));
}
function worldToScreen(p) {
  const v = p.clone().project(camera);
  return new THREE.Vector2((v.x * 0.5 + 0.5) * container.clientWidth, (-v.y * 0.5 + 0.5) * container.clientHeight);
}
function updateFreeTransformHandles() {
  if (!activeDummy || currentMode !== 'free') return;
  const sc = getLogoCorners(activeDummy).map(worldToScreen);
  const xs = sc.map(p => p.x), ys = sc.map(p => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  ftBox.style.cssText = `left:${minX}px;top:${minY}px;width:${maxX-minX}px;height:${maxY-minY}px`;
  ['nw','ne','se','sw'].forEach((k, i) => {
    const h = ftEl.querySelector(`.ft-handle.${k}`);
    if (h) { h.style.left = sc[i].x + 'px'; h.style.top = sc[i].y + 'px'; }
  });
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  ftCenterScreen.set(cx, cy);
  ftRotateHandle.style.left = cx + 'px'; ftRotateHandle.style.top = (minY - 28) + 'px';
  ftRotateLine.style.left = cx + 'px'; ftRotateLine.style.top = (minY - 28) + 'px';
  ftRotateLine.style.height = Math.abs(cy - (minY - 28)) + 'px';
}
ftEl.querySelectorAll('.ft-handle').forEach(h => {
  h.onpointerdown = e => {
    e.preventDefault(); e.stopPropagation();
    if (!activeDummy || activeDummy.userData.locked) return;
    ftDragging = 'scale'; ftStartMouse.set(e.clientX, e.clientY); ftStartScale = activeDummy.scale.x;
    controls.enabled = false; h.setPointerCapture(e.pointerId);
  };
});
ftRotateHandle.onpointerdown = e => {
  e.preventDefault(); e.stopPropagation();
  if (!activeDummy || activeDummy.userData.locked) return;
  ftDragging = 'rotate';
  ftStartAngle = Math.atan2(e.clientY - ftCenterScreen.y, e.clientX - ftCenterScreen.x);
  controls.enabled = false; ftRotateHandle.setPointerCapture(e.pointerId);
};
window.addEventListener('pointermove', e => {
  if (!ftDragging || !activeDummy) return;
  if (ftDragging === 'scale') {
    const dist = Math.hypot(e.clientX - ftCenterScreen.x, e.clientY - ftCenterScreen.y);
    const startDist = Math.hypot(ftStartMouse.x - ftCenterScreen.x, ftStartMouse.y - ftCenterScreen.y) || 1;
    let ns = Math.max(0.12, Math.min(ftStartScale * (dist / startDist), 8));
    document.getElementById('propScale').value = ns;
    document.getElementById('propScaleValue').textContent = ns.toFixed(2);
    if (activeDummy.userData.isBg) {
      const a = activeDummy.userData.aspect || 1;
      activeDummy.scale.set(ns, ns / a, 1);
    } else {
      activeDummy.scale.setScalar(ns);
      scheduleDecal(activeDummy);
    }
    updateFreeTransformHandles();
  }
  if (ftDragging === 'rotate' && !activeDummy.userData.isBg) {
    const ang = Math.atan2(e.clientY - ftCenterScreen.y, e.clientX - ftCenterScreen.x);
    const delta = ang - ftStartAngle;
    activeDummy.quaternion.multiplyQuaternions(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), delta), activeDummy.quaternion);
    ftStartAngle = ang;
    scheduleDecal(activeDummy);
    updateFreeTransformHandles();
  }
});
window.addEventListener('pointerup', () => { if (ftDragging) { ftDragging = null; controls.enabled = true; pushHistory(); } });

function addLogoToScene(texture, aspect, isText, dataURL, textContent = '', textColor = '#000', font = 'Inter', fontSize = 120) {
  const dummy = new THREE.Object3D();
  dummy.userData = { 
    texture, aspect, isText, dataURL, textContent, textColor, font, fontSize, 
    opacity: 1, visible: true, locked: false, curve: 0, decals: [] 
  };
  shirtGroup.add(dummy);
  const ox = logoCount % 2 === 0 ? 0.12 : -0.12;
  const oy = Math.floor(logoCount / 2) * -0.18;
  raycaster.setFromCamera(new THREE.Vector2(ox, oy), camera);
  const hits = raycaster.intersectObjects(shirtMeshes, true);
  if (hits.length) {
    const hit = hits[0];
    dummy.position.copy(shirtGroup.worldToLocal(hit.point.clone()));
    const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
    const ln = n.clone().transformDirection(new THREE.Matrix4().copy(shirtGroup.matrixWorld).invert()).normalize();
    const up = new THREE.Vector3(0, 1, 0);
    let right = new THREE.Vector3().crossVectors(up, ln);
    if (right.lengthSq() < 0.001) right.set(1, 0, 0);
    right.normalize();
    const actualUp = new THREE.Vector3().crossVectors(ln, right).normalize();
    dummy.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(right, actualUp, ln));
  } else dummy.position.set(0, 0.1, 0.4);

  dummy.userData.curve = isOnSleeve(dummy) ? 0.7 : 0;

  logoCount++;
  createDecalNow(dummy);
  layers.push(dummy);
  addDesignLayer(dummy, isText ? `Teks ${logoCount}` : `Logo ${logoCount}`, isText ? '📝' : '🖼️');
  pushHistory();
  if (dummy.userData.curve > 0.01) showToast('Logo di lengan — lekung auto diaktifkan');
}

async function getStateForSave() {
  const processed = [];
  for (const d of layers.filter(l => !l.userData.isBg)) {
    let dataURL = d.userData.dataURL;
    if (dataURL) dataURL = await resizeDataURL(dataURL, 900);
    processed.push({
      position: d.position.toArray(), quaternion: d.quaternion.toArray(), scale: d.scale.toArray(),
      aspect: d.userData.aspect, isText: !!d.userData.isText, dataURL,
      textContent: d.userData.textContent || '', textColor: d.userData.textColor || '#000000',
      font: d.userData.font || 'Inter', fontSize: d.userData.fontSize || 120,
      name: d.userData.name || 'Logo', icon: d.userData.icon || '🖼️',
      opacity: d.userData.opacity || 1, visible: d.userData.visible !== false, locked: !!d.userData.locked,
      curve: d.userData.curve || 0
    });
  }
  return {
    color: currentShirtColor, bgColor: currentBgColor, isTransparentBg,
    ambient: ambientLight.intensity, directional: mainLight.intensity, shadow: mainLight.shadow.intensity,
    bgOpacity, bgFillMode, layers: processed
  };
}

async function pushHistory() {

function clearAllLayers() {

    if (d.userData.isBg) return;
    disposeDummyDecals(d);

    shirtGroup.remove(d);
  });
  layers = layers.filter(l => l.userData.isBg);

  [...layerListUI.children].forEach(el => {
    if (el.id !== 'layer-base' && !el.querySelector('.layer-name')?.textContent.includes('Latar')) el.remove();

async function restoreState(state) {
  clearAllLayers();
  hideFreeTransform();
  propertiesPanel.classList.remove('active');

  currentShirtColor = state.color || '#ffffff';
  shirtMaterials.forEach(m => m.color.set(currentShirtColor));
  document.getElementById('customColor').value = currentShirtColor;

  currentBgColor = state.bgColor || '#09090b';
  document.getElementById('bgColor').value = currentBgColor;
  isTransparentBg = !!state.isTransparentBg;
  document.getElementById('toggleTransparent').classList.toggle('active', isTransparentBg);

  ambientLight.intensity = state.ambient ?? 0.5;
  mainLight.intensity = state.directional ?? 2;
  mainLight.shadow.intensity = state.shadow ?? 1;
  ground.material.opacity = 0.3 * (state.shadow ?? 1);
  document.getElementById('ambientSlider').value = ambientLight.intensity;
  document.getElementById('dirSlider').value = mainLight.intensity;
  document.getElementById('shadowSlider').value = mainLight.shadow.intensity;
  document.getElementById('ambientValue').textContent = ambientLight.intensity.toFixed(2);
  document.getElementById('dirValue').textContent = mainLight.intensity.toFixed(2);
  document.getElementById('shadowValue').textContent = mainLight.shadow.intensity.toFixed(2);

  bgOpacity = state.bgOpacity ?? 1;
  bgFillMode = state.bgFillMode || 'stretch';
  applySolidBackground();

  for (const ldata of (state.layers || [])) {
    if (!ldata.dataURL) continue;
    await new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        try {
          const tex = new THREE.Texture(img);
          tex.colorSpace = THREE.SRGBColorSpace; tex.needsUpdate = true;
          const dummy = new THREE.Object3D();
          dummy.userData = {
            texture: tex, aspect: ldata.aspect || 1, isText: !!ldata.isText,
            dataURL: ldata.dataURL, textContent: ldata.textContent || '',
            textColor: ldata.textColor || '#000', font: ldata.font || 'Inter',
            fontSize: ldata.fontSize || 120, name: ldata.name || 'Logo',
            icon: ldata.icon || '🖼️', opacity: ldata.opacity || 1,
            visible: ldata.visible !== false, locked: !!ldata.locked,
            curve: ldata.curve || 0, decals: []
          };
          dummy.position.fromArray(ldata.position || [0, 0, 0.4]);
          dummy.quaternion.fromArray(ldata.quaternion || [0, 0, 0, 1]);
          const s = Math.max(...(ldata.scale || [1, 1, 1]));
          dummy.scale.setScalar(Math.max(0.12, s));
          shirtGroup.add(dummy);
          createDecalNow(dummy);
          layers.push(dummy);
          logoCount++;
          addDesignLayer(dummy, dummy.userData.name, dummy.userData.icon);
          const el = document.getElementById(dummy.userData.layerId);
          if (el) {
            if (!dummy.userData.visible) { el.querySelector('.vis').classList.add('hidden'); el.querySelector('.vis').textContent = '👁️‍🗨️'; }
            if (dummy.userData.locked) { el.querySelector('.lock').textContent = '🔒'; el.classList.add('locked'); }
          }
        } catch (e) { console.warn(e); }
        resolve();
      };
      img.onerror = () => resolve();
      img.src = ldata.dataURL;
    });
  }
  transformControls.detach(); activeDummy = null;
  gizmoControlsUI.classList.remove('active');
  document.getElementById('layer-base')?.classList.add('active');
}
function undo() { if (historyIndex <= 0) return; historyIndex--; restoreState(history[historyIndex]).then(updateUndoRedoButtons); }
function redo() { if (historyIndex >= history.length - 1) return; historyIndex++; restoreState(history[historyIndex]).then(updateUndoRedoButtons); }

btnPreview.onclick = () => { if (isRecording) return; isPreviewing ? stopPreview() : startPreview(); };
function startPreview() {
  if (isPreviewing || isRecording) return;
  isPreviewing = true;
  btnPreview.classList.add('playing'); btnPreview.textContent = '⏹ Stop Preview';
  btnRenderVideo.disabled = true; transformHelper.visible = false; hideFreeTransform(); controls.enabled = false;
  camera.position.set(0, 0.15, 5.2); controls.target.set(0, 0.05, 0); controls.update();
  shirtGroup.rotation.y = 0;
  const start = performance.now(), dur = recordDuration * 1000;
  recordingOverlay.classList.add('active');
  function loop(now) {
    if (!isPreviewing) return;
    const p = Math.min((now - start) / dur, 1);
    shirtGroup.rotation.y = p * Math.PI * 2 * rotationSpeed;
    recordingText.textContent = `Preview... ${Math.ceil((dur - (now - start)) / 1000)}s`;
    if (p < 1) previewAnimationId = requestAnimationFrame(loop); else stopPreview();
  }
  previewAnimationId = requestAnimationFrame(loop);
}
function stopPreview() {
  isPreviewing = false;
  if (previewAnimationId) cancelAnimationFrame(previewAnimationId);
  btnPreview.classList.remove('playing'); btnPreview.textContent = '▶ Mainkan Preview';
  btnRenderVideo.disabled = false; recordingOverlay.classList.remove('active');
  shirtGroup.rotation.y = 0; transformHelper.visible = true; controls.enabled = true;
}

btnRenderVideo.onclick = () => { if (!isRecording && !isPreviewing) startVideoRecord(); };
async function startVideoRecord() {
  if (isRecording) return;
  transformHelper.visible = false; hideFreeTransform(); controls.enabled = false; btnPreview.disabled = true;
  const oldSize = new THREE.Vector2(); renderer.getSize(oldSize);
  const oldPR = renderer.getPixelRatio();
  const tw = recordQuality === 0 ? 720 : 1080, th = recordQuality === 0 ? 1280 : 1920;
  renderer.setPixelRatio(1); renderer.setSize(tw, th, false);
  camera.aspect = tw / th; camera.updateProjectionMatrix();
  camera.position.set(0, 0.15, 5.2); controls.target.set(0, 0.05, 0); controls.update();
  for (let i = 0; i < 8; i++) { renderer.clear(); renderer.render(scene, camera); }
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  const stream = renderer.domElement.captureStream(30);
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: recordQuality === 0 ? 5e6 : 8e6 });
  mediaRecorder.ondataavailable = e => { if (e.data.size) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(recordedChunks, { type: 'video/webm' }));
    a.download = `design-portrait-${Date.now()}.webm`; a.click();
    renderer.setPixelRatio(oldPR); renderer.setSize(oldSize.x, oldSize.y, false);
    camera.aspect = oldSize.x / oldSize.y; camera.updateProjectionMatrix();
    transformHelper.visible = true; controls.enabled = true;
    isRecording = false; btnRenderVideo.disabled = false; btnPreview.disabled = false;
    btnRenderVideo.classList.remove('recording'); btnRenderVideo.textContent = '🎥 Render Video';
    recordingOverlay.classList.remove('active'); shirtGroup.rotation.y = 0;
  };
  isRecording = true; btnRenderVideo.disabled = true; btnRenderVideo.classList.add('recording');
  btnRenderVideo.textContent = '⏹ Sedang Merakam...'; recordingOverlay.classList.add('active');
  mediaRecorder.start(100); shirtGroup.rotation.y = 0;
  const start = performance.now(), dur = recordDuration * 1000;
  function loop(now) {
    if (!isRecording) return;
    const p = Math.min((now - start) / dur, 1);
    shirtGroup.rotation.y = p * Math.PI * 2 * rotationSpeed;
    recordingText.textContent = `Sedang merakam... ${Math.ceil((dur - (now - start)) / 1000)}s`;
    renderer.render(scene, camera);
    if (p < 1) requestAnimationFrame(loop);
    else setTimeout(() => mediaRecorder?.state !== 'inactive' && mediaRecorder.stop(), 120);
  }
  requestAnimationFrame(loop);
}

// ===== UI =====
function setMode(m) {
  currentMode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  if (m === 'translate') { document.getElementById('btnTranslate').classList.add('active'); hideFreeTransform(); if (activeDummy) { transformControls.attach(activeDummy); transformControls.setMode('translate'); } }
  else if (m === 'scale') { document.getElementById('btnScale').classList.add('active'); hideFreeTransform(); if (activeDummy) { transformControls.attach(activeDummy); transformControls.setMode('scale'); } }
  else { document.getElementById('btnFree').classList.add('active'); transformControls.detach(); if (activeDummy) showFreeTransform(); }
}
document.getElementById('btnTranslate').onclick = () => setMode('translate');
document.getElementById('btnScale').onclick = () => setMode('scale');
document.getElementById('btnFree').onclick = () => setMode('free');

['#ffffff','#171717','#64748b','#dc2626','#2563eb','#16a34a','#ca8a04','#9333ea'].forEach((hex, i) => {
  const b = document.createElement('button');
  b.className = 'color-btn' + (i === 0 ? ' active' : '');
  b.style.background = hex;
  b.onclick = () => {
    document.querySelectorAll('.color-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); currentShirtColor = hex;
    shirtMaterials.forEach(m => m.color.set(hex)); pushHistory();
  };
  document.getElementById('colorGrid').appendChild(b);
});
document.getElementById('customColor').oninput = e => {
  document.querySelectorAll('.color-btn').forEach(x => x.classList.remove('active'));
  currentShirtColor = e.target.value; shirtMaterials.forEach(m => m.color.set(e.target.value));
};
document.getElementById('customColor').onchange = () => pushHistory();

document.getElementById('viewFront').onclick = () => { camera.position.set(0,0,4.5); controls.target.set(0,0,0); setActive('viewFront'); };
document.getElementById('viewBack').onclick = () => { camera.position.set(0,0,-4.5); controls.target.set(0,0,0); setActive('viewBack'); };
document.getElementById('viewRight').onclick = () => { camera.position.set(4.5,0,0); controls.target.set(0,0,0); setActive('viewRight'); };
document.getElementById('viewLeft').onclick = () => { camera.position.set(-4.5,0,0); controls.target.set(0,0,0); setActive('viewLeft'); };
function setActive(id) { document.querySelectorAll('#view-toggles button').forEach(b => b.classList.remove('active')); document.getElementById(id).classList.add('active'); }

window.addEventListener('keydown', e => {
  const tag = document.activeElement?.tagName;
  const isEditing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    if (e.key === 'y') { e.preventDefault(); redo(); }
    if (e.key === 's') { e.preventDefault(); document.getElementById('btnSaveProject').click(); }
    if (e.key === 't') { e.preventDefault(); if (activeDummy) setMode('free'); }
    if (e.key === 'd') { e.preventDefault(); if (activeDummy && !activeDummy.userData.isBg) document.getElementById('btnDuplicate').click(); }
    return;
  }
  if (isEditing) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && activeDummy && !activeDummy.userData.isBg) {
    e.preventDefault();
    const el = document.getElementById(activeDummy.userData.layerId);
    if (el) deleteLayer(activeDummy, el);
  }
  if (e.key === 'Escape') {
    transformControls.detach(); hideFreeTransform();
    activeDummy = null; gizmoControlsUI.classList.remove('active');
    propertiesPanel.classList.remove('active');
  }
});

document.getElementById('saveBtn').onclick = () => {
  transformHelper.visible = false; hideFreeTransform();
  const oldSize = renderer.getSize(new THREE.Vector2());
  const oldPR = renderer.getPixelRatio();
  renderer.setPixelRatio(1);
  renderer.setSize(2000, 2000, false);
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = 'design-baju-hd.png';
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
  renderer.setPixelRatio(oldPR);
  renderer.setSize(oldSize.x, oldSize.y, false);
  transformHelper.visible = true;
  if (currentMode === 'free' && activeDummy) showFreeTransform();
  renderer.render(scene, camera);
};

function animate() {
  requestAnimationFrame(animate);
  if (!isRecording) {
    controls.update();
    renderer.render(scene, camera);
    if (currentMode === 'free' && activeDummy && !ftDragging) updateFreeTransformHandles();
  }
}
animate();
window.addEventListener('resize', () => {
  if (isRecording) return;
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
});
applySolidBackground();
</script>
