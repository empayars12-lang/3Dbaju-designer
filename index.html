<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pro Baju Designer 3D</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; }
    
    #app { display: flex; height: 100vh; background: #121212; color: #fff; }
    
    /* PANEL KIRI (KAWALAN) */
    #sidebar {
      width: 320px; background: #1e1e24; padding: 20px; display: flex; flex-direction: column; gap: 15px;
      border-right: 1px solid #333; z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,0.5); overflow-y: auto;
    }
    #sidebar h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; margin-bottom: 5px;}
    
    /* Warna */
    .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 5px; }
    .color-btn {
      aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
      transition: all 0.2s; position: relative;
    }
    .color-btn:hover { transform: scale(1.1); }
    .color-btn.active { border-color: #38bdf8; transform: scale(1.1); }
    
    /* Custom Color */
    .custom-color-wrapper { display: flex; align-items: center; gap: 10px; background: #2a2a35; padding: 5px 10px; border-radius: 6px;}
    .custom-color-wrapper input[type="color"] { width: 40px; height: 30px; border: none; background: none; cursor: pointer;}
    .custom-color-wrapper span { font-size: 12px; color: #aaa;}

    /* Upload Logo */
    .upload-btn {
      background: #38bdf8; color: #000; text-align: center; padding: 12px; border-radius: 6px;
      font-weight: 600; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; margin-bottom: 10px;
    }
    .upload-btn:hover { background: #0ea5e9; }
    .upload-btn input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    
    /* Slider Saiz Logo */
    .slider-container { display: flex; flex-direction: column; gap: 5px; background: #2a2a35; padding: 10px; border-radius: 6px;}
    input[type=range] { width: 100%; accent-color: #38bdf8; }
    
    /* Butang Save */
    .save-btn {
      margin-top: auto; background: #10b981; color: white; border: none; padding: 15px;
      border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s;
    }
    .save-btn:hover { background: #059669; }

    /* KAWASAN 3D & OVERLAY GAMBAR */
    #viewer-container { flex: 1; position: relative; background: radial-gradient(circle, #2a2a35 0%, #121212 100%); overflow: hidden; }
    #viewer-container canvas { display: block; }
    
    /* Gambar yg di-upload (Boleh drag) */
    .draggable-logo {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      cursor: grab; touch-action: none; user-select: none; z-index: 5;
    }
    .draggable-logo:active { cursor: grabbing; }
    .draggable-logo img { width: 100%; height: auto; pointer-events: none; }

    /* Loading */
    #loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #121212; color: #38bdf8; z-index: 100; font-weight: 600; letter-spacing: 1px;
    }

    /* Responsive (Mobile) */
    @media (max-width: 768px) {
      #app { flex-direction: column; }
      #sidebar { width: 100%; height: 45vh; border-right: none; border-top: 1px solid #333; order: 2; padding: 15px;}
      #viewer-container { order: 1; flex: 1; }
      .save-btn { margin-top: 10px; }
      .color-grid { grid-template-columns: repeat(6, 1fr); }
    }
  </style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div>
      <h2>1. Warna Baju</h2>
      <div class="color-grid" id="colorGrid"></div>
      <div class="custom-color-wrapper">
        <input type="color" id="customColor" value="#ffffff">
        <span>Warna Custom</span>
      </div>
    </div>
    
    <div>
      <h2>2. Upload Logo</h2>
      <div class="upload-btn">
        + Tambah Gambar/Logo
        <input type="file" id="logoUpload" accept="image/*" multiple>
      </div>
    </div>
    
    <div class="slider-container">
      <h2>3. Saiz Logo</h2>
      <input type="range" id="logoSize" min="50" max="400" step="10" value="150">
    </div>
    
    <button class="save-btn" onclick="saveImage()">⬇️ Save Design</button>
  </div>
  
  <div id="viewer-container">
    <div id="loading">MEMUATKAN 3D...</div>
    <!-- Tempat gambar akan dimasukkan -->
    <div id="logos-container"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { toPng } from 'https://esm.sh/html-to-image@1.11.11'; // Library untuk save gambar beserta logo HTML

// ===== DATA WARNA =====
const COLORS = [
  { name: 'Putih', hex: '#ffffff' },
  { name: 'Hitam', hex: '#1a1a1a' },
  { name: 'Kelabu', hex: '#64748b' },
  { name: 'Merah', hex: '#dc2626' },
  { name: 'Biru', hex: '#2563eb' },
  { name: 'Hijau', hex: '#16a34a' },
  { name: 'Kuning', hex: '#ca8a04' },
  { name: 'Ungu', hex: '#9333ea' }
];

// ===== SETUP ASAS THREE.JS =====
const container = document.getElementById('viewer-container');
const scene = new THREE.Scene();
scene.background = null; 

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

// ===== LAMPU =====
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 2);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
fillLight.position.set(-5, 5, -5);
scene.add(fillLight);

// ===== KAWALAN KAMERA =====
const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false;
controls.enableZoom = true;
controls.minDistance = 2;
controls.maxDistance = 8;
controls.target.set(0, 0, 0);

// ===== VARIABEL GLOBAL =====
let shirtMesh = null;
let shirtMaterials = [];
let activeLogo = null; // Simpan rujukan logo yang sedang aktif (untuk slider saiz)

// ===== LOAD MODEL 3D =====
const loader = new GLTFLoader();
const MODEL_URL = './T_shirt_gltf.gltf'; // Pastikan nama fail betul

loader.load(
  MODEL_URL,
  (gltf) => {
    shirtMesh = gltf.scene;
    
    // Auto-fit size model
    const box = new THREE.Box3().setFromObject(shirtMesh);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxSize = Math.max(size.x, size.y, size.z);
    const scaleFactor = 2.5 / maxSize; 
    
    shirtMesh.scale.set(scaleFactor, scaleFactor, scaleFactor);
    shirtMesh.position.set(-center.x * scaleFactor, -center.y * scaleFactor, -center.z * scaleFactor);
    camera.position.set(0, 0, maxSize * 1.8);
    controls.update();

    // Setup material baju
    shirtMesh.traverse((child) => {
      if (child.isMesh) {
        child.material = new THREE.MeshStandardMaterial({
          color: '#ffffff', roughness: 0.9, metalness: 0.0
        });
        shirtMaterials.push(child.material);
      }
    });
    
    scene.add(shirtMesh);
    document.getElementById('loading').style.display = 'none';
  },
  undefined,
  (error) => {
    console.error('Error:', error);
    document.getElementById('loading').innerText = 'Gagal muat model.';
  }
);

// ===== BINA BUTANG WARNA =====
const colorGrid = document.getElementById('colorGrid');
COLORS.forEach((c, i) => {
  const btn = document.createElement('button');
  btn.className = 'color-btn' + (i === 0 ? ' active' : '');
  btn.style.background = c.hex;
  btn.title = c.name;
  
  btn.addEventListener('click', () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    shirtMaterials.forEach(mat => mat.color.set(c.hex));
  });
  
  colorGrid.appendChild(btn);
});

// Custom Color Picker
const customColorInput = document.getElementById('customColor');
customColorInput.addEventListener('input', (e) => {
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
  shirtMaterials.forEach(mat => mat.color.set(e.target.value));
});

// ===== LOGIK DRAG GAMBAR (HTML OVERLAY) =====
const logosContainer = document.getElementById('logos-container');
let offsetX, offsetY;

// Fungsi buat elemen gambar yang boleh di-drag
function createDraggableLogo(imageUrl) {
  const div = document.createElement('div');
  div.className = 'draggable-logo';
  
  // Saiz asal ikut slider
  const initialSize = document.getElementById('logoSize').value;
  div.style.width = initialSize + 'px';

  const img = document.createElement('img');
  img.src = imageUrl;
  div.appendChild(img);

  // Logik Drag & Drop
  div.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    activeLogo = div; // Set sebagai logo aktif untuk slider
    div.style.zIndex = 10; // Naikkan ke depan
    
    // Kira offset supaya gambar tak lompat
    const rect = div.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    
    // Dengar pergerakan mouse
    document.addEventListener('pointermove', onDrag);
    document.addEventListener('pointerup', onDragEnd);
  });

  function onDrag(e) {
    // Kira posisi baru
    const containerRect = logosContainer.getBoundingClientRect();
    let newX = e.clientX - containerRect.left - offsetX;
    let newY = e.clientY - containerRect.top - offsetY;
    
    div.style.left = newX + 'px';
    div.style.top = newY + 'px';
    div.style.transform = 'none'; // Buang transform asal
  }

  function onDragEnd() {
    div.style.zIndex = 5; // Turunkan semula
    document.removeEventListener('pointermove', onDrag);
    document.removeEventListener('pointerup', onDragEnd);
  }

  logosContainer.appendChild(div);
}

// Event Listener Upload Gambar
document.getElementById('logoUpload').addEventListener('change', (e) => {
  const files = e.target.files;
  for (let i = 0; i < files.length; i++) {
    const reader = new FileReader();
    reader.onload = (event) => {
      createDraggableLogo(event.target.result);
    };
    reader.readAsDataURL(files[i]);
  }
  // Reset input supaya boleh upload fail yg sama berulang kali
  e.target.value = ''; 
});

// Slider Saiz (Ubah saiz logo aktif)
document.getElementById('logoSize').addEventListener('input', (e) => {
  if (activeLogo) {
    activeLogo.style.width = e.target.value + 'px';
  }
});

// ===== SIMPAN GAMBAR (GABUNG 3D + LOGO HTML) =====
window.saveImage = async function() {
  // Ambil screenshot dari canvas 3D
  renderer.render(scene, camera);
  const canvasData = renderer.domElement.toDataURL('image/png');
  
  // Gabungkan dengan gambar HTML (logo) guna html-to-image
  const containerEl = document.getElementById('viewer-container');
  
  // Sembunyikan loading jika ada
  document.getElementById('loading').style.display = 'none';
  
  try {
    const combinedImage = await toPng(containerEl, {
      cacheBust: true,
      pixelRatio: 2, // Kualiti tinggi
    });
    
    const link = document.createElement('a');
    link.download = 'design-baju.png';
    link.href = combinedImage;
    link.click();
  } catch (err) {
    alert('Gagal simpan gambar. Sila cuba lagi.');
    console.error(err);
  }
};

// ===== RENDER LOOP =====
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ===== RESPONSIVE =====
window.addEventListener('resize', () => {
  const width = container.clientWidth;
  const height = container.clientHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
});
</script>

</body>
</html>
