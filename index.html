<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pro Baju Designer 3D</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; }
    
    #app { display: flex; height: 100vh; background: #121212; color: #fff; }
    
    /* PANEL KIRI */
    #sidebar {
      width: 320px; background: #1e1e24; padding: 20px; display: flex; flex-direction: column; gap: 15px;
      border-right: 1px solid #333; z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,0.5); overflow-y: auto;
    }
    #sidebar h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; margin-bottom: 5px;}
    
    /* Warna */
    .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 5px; }
    .color-btn {
      aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
      transition: all 0.2s; position: relative;
    }
    .color-btn:hover { transform: scale(1.1); }
    .color-btn.active { border-color: #38bdf8; transform: scale(1.1); }
    
    .custom-color-wrapper { display: flex; align-items: center; gap: 10px; background: #2a2a35; padding: 5px 10px; border-radius: 6px;}
    .custom-color-wrapper input[type="color"] { width: 40px; height: 30px; border: none; background: none; cursor: pointer;}
    .custom-color-wrapper span { font-size: 12px; color: #aaa;}

    /* Upload Logo */
    .upload-btn {
      background: #38bdf8; color: #000; text-align: center; padding: 12px; border-radius: 6px;
      font-weight: 600; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; margin-bottom: 10px;
    }
    .upload-btn:hover { background: #0ea5e9; }
    .upload-btn input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    
    /* Slider */
    .slider-container { display: flex; flex-direction: column; gap: 5px; background: #2a2a35; padding: 10px; border-radius: 6px;}
    input[type=range] { width: 100%; accent-color: #38bdf8; }
    
    /* Butang Save */
    .save-btn {
      margin-top: auto; background: #10b981; color: white; border: none; padding: 15px;
      border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s;
    }
    .save-btn:hover { background: #059669; }

    /* KAWASAN 3D */
    #viewer-container { flex: 1; position: relative; background: radial-gradient(circle, #2a2a35 0%, #121212 100%); overflow: hidden; }
    #viewer-container canvas { display: block; }

    /* Loading */
    #loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #121212; color: #38bdf8; z-index: 100; font-weight: 600; letter-spacing: 1px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      #app { flex-direction: column; }
      #sidebar { width: 100%; height: 40vh; border-right: none; border-top: 1px solid #333; order: 2; padding: 15px;}
      #viewer-container { order: 1; flex: 1; }
      .save-btn { margin-top: 10px; }
      .color-grid { grid-template-columns: repeat(6, 1fr); }
    }
  </style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div>
      <h2>1. Warna Baju</h2>
      <div class="color-grid" id="colorGrid"></div>
      <div class="custom-color-wrapper">
        <input type="color" id="customColor" value="#ffffff">
        <span>Warna Custom</span>
      </div>
    </div>
    
    <div>
      <h2>2. Upload Logo</h2>
      <div class="upload-btn">
        + Tambah Gambar/Logo
        <input type="file" id="logoUpload" accept="image/*" multiple>
      </div>
      <p style="font-size: 11px; color: #888; margin-top: 5px;">Klik pada logo di skrin 3D untuk gerakkan.</p>
    </div>
    
    <div class="slider-container">
      <h2>3. Saiz Logo</h2>
      <input type="range" id="logoSize" min="0.1" max="2.0" step="0.05" value="0.5">
    </div>
    
    <button class="save-btn" onclick="saveImage()">⬇️ Save Design</button>
  </div>
  
  <div id="viewer-container">
    <div id="loading">MEMUATKAN 3D...</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

// ===== DATA WARNA =====
const COLORS = [
  { name: 'Putih', hex: '#ffffff' }, { name: 'Hitam', hex: '#1a1a1a' }, { name: 'Kelabu', hex: '#64748b' },
  { name: 'Merah', hex: '#dc2626' }, { name: 'Biru', hex: '#2563eb' }, { name: 'Hijau', hex: '#16a34a' },
  { name: 'Kuning', hex: '#ca8a04' }, { name: 'Ungu', hex: '#9333ea' }
];

// ===== SETUP ASAS THREE.JS =====
const container = document.getElementById('viewer-container');
const scene = new THREE.Scene();
scene.background = null; 

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

// ===== LAMPU =====
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 2);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
fillLight.position.set(-5, 5, -5);
scene.add(fillLight);

// ===== KAWALAN KAMERA =====
const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false;
controls.enableZoom = true;
controls.minDistance = 2;
controls.maxDistance = 8;
controls.target.set(0, 0, 0);

// ===== KAWALAN GIZMO =====
const transformControls = new TransformControls(camera, renderer.domElement);
transformControls.setMode('translate'); 
transformControls.showZ = false; // KUNCI PAKSA: Sembunyikan anak panah Z supaya tak terapung
scene.add(transformControls);

transformControls.addEventListener('dragging-changed', function (event) {
  controls.enabled = !event.value;
});

// ===== VARIABEL GLOBAL =====
let shirtMesh = null;
let shirtMaterials = [];
let activeLogo = null;
let shirtBox = new THREE.Box3(); // Simpan saiz baju
let shirtCenter = new THREE.Vector3(); // Simpan posisi tengah baju

// ===== LOAD MODEL 3D =====
const loader = new GLTFLoader();
const MODEL_URL = './T_shirt_gltf.gltf';

loader.load(
  MODEL_URL,
  (gltf) => {
    shirtMesh = gltf.scene;
    
    // Auto-fit size model
    shirtBox.setFromObject(shirtMesh);
    const size = shirtBox.getSize(new THREE.Vector3());
    shirtCenter = shirtBox.getCenter(new THREE.Vector3());
    const maxSize = Math.max(size.x, size.y, size.z);
    const scaleFactor = 2.5 / maxSize; 
    
    shirtMesh.scale.set(scaleFactor, scaleFactor, scaleFactor);
    // Update box selepas scale
    shirtMesh.updateMatrixWorld(true);
    shirtBox.setFromObject(shirtMesh);
    shirtCenter = shirtBox.getCenter(new THREE.Vector3());
    const newSize = shirtBox.getSize(new THREE.Vector3());

    // Set posisi baju ke tengah skrin
    shirtMesh.position.set(-shirtCenter.x, -shirtCenter.y, -shirtCenter.z);
    
    // Kira semula box selepas posisi diubah
    shirtMesh.updateMatrixWorld(true);
    shirtBox.setFromObject(shirtMesh);
    shirtCenter = shirtBox.getCenter(new THREE.Vector3());

    camera.position.set(0, 0, newSize.z * 3.5);
    controls.update();

    // Setup material baju
    shirtMesh.traverse((child) => {
      if (child.isMesh) {
        child.material = new THREE.MeshStandardMaterial({
          color: '#ffffff', roughness: 0.9, metalness: 0.0
        });
        shirtMaterials.push(child.material);
      }
    });
    
    scene.add(shirtMesh);
    document.getElementById('loading').style.display = 'none';
  },
  undefined,
  (error) => {
    console.error('Error:', error);
    document.getElementById('loading').innerText = 'Gagal muat model.';
  }
);

// ===== BINA BUTANG WARNA =====
const colorGrid = document.getElementById('colorGrid');
COLORS.forEach((c, i) => {
  const btn = document.createElement('button');
  btn.className = 'color-btn' + (i === 0 ? ' active' : '');
  btn.style.background = c.hex;
  btn.title = c.name;
  
  btn.addEventListener('click', () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    shirtMaterials.forEach(mat => mat.color.set(c.hex));
  });
  colorGrid.appendChild(btn);
});

// Custom Color
document.getElementById('customColor').addEventListener('input', (e) => {
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
  shirtMaterials.forEach(mat => mat.color.set(e.target.value));
});

// ===== LOGIK UPLOAD & DRAG LOGO =====
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const logoList = []; 

// Event Klik pada Skrin 3D
renderer.domElement.addEventListener('pointerdown', (e) => {
  mouse.x = (e.clientX / renderer.domElement.clientWidth) * 2 - 1;
  mouse.y = -(e.clientY / renderer.domElement.clientHeight) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(logoList);
  
  if (intersects.length > 0) {
    activeLogo = intersects[0].object;
    transformControls.attach(activeLogo);
    document.getElementById('logoSize').value = activeLogo.scale.x;
  } else {
    transformControls.detach();
    activeLogo = null;
  }
});

// Event Upload Gambar
document.getElementById('logoUpload').addEventListener('change', (e) => {
  const files = e.target.files;
  for (let i = 0; i < files.length; i++) {
    const reader = new FileReader();
    reader.onload = (event) => {
      create3DLogo(event.target.result);
    };
    reader.readAsDataURL(files[i]);
  }
  e.target.value = ''; 
});

// Fungsi Buat Logo 3D (Duduk tepat atas dada baju)
function create3DLogo(imageUrl) {
  const textureLoader = new THREE.TextureLoader();
  textureLoader.load(imageUrl, (texture) => {
    texture.colorSpace = THREE.SRGBColorSpace;

    const img = texture.image;
    const aspect = img.width / img.height;
    const baseWidth = 0.4; // Saiz asal logo
    const baseHeight = baseWidth / aspect;

    const geometry = new THREE.PlaneGeometry(baseWidth, baseHeight);
    const material = new THREE.MeshBasicMaterial({ 
      map: texture, 
      transparent: true, 
      depthTest: false, // Supaya sentiasa nampak depan
      depthWrite: false
    });
    
    const logo3D = new THREE.Mesh(geometry, material);
    
    // KIRA POSISI TENGAH BAJU SECARA AUTOMATIK
    if (shirtMesh) {
      const shirtSize = shirtBox.getSize(new THREE.Vector3());
      
      // Letak di tengah X, dan sikit ke atas (dada) untuk Y
      // Untuk Z, letak di bahagian paling depan baju
      const posX = shirtCenter.x;
      const posY = shirtCenter.y + (shirtSize.y * 0.15); // Naik sikit ke dada
      const posZ = shirtCenter.z + (shirtSize.z / 2) + 0.05; // Sikit depan dari baju
      
      logo3D.position.set(posX, posY, posZ);
    } else {
      logo3D.position.set(0, 0.5, 1.5);
    }
    
    logo3D.scale.set(1, 1, 1);

    scene.add(logo3D);
    logoList.push(logo3D);

    activeLogo = logo3D;
    transformControls.attach(activeLogo);
  });
}

// Slider Saiz
document.getElementById('logoSize').addEventListener('input', (e) => {
  if (activeLogo) {
    const val = parseFloat(e.target.value);
    activeLogo.scale.set(val, val, val);
  }
});

// ===== SIMPAN GAMBAR =====
window.saveImage = function() {
  transformControls.visible = false;
  renderer.render(scene, camera);
  const dataURL = renderer.domElement.toDataURL('image/png');
  transformControls.visible = true;
  
  const link = document.createElement('a');
  link.download = 'design-baju.png';
  link.href = dataURL;
  link.click();
};

// ===== RENDER LOOP =====
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ===== RESPONSIVE =====
window.addEventListener('resize', () => {
  const width = container.clientWidth;
  const height = container.clientHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
});
</script>

</body>
</html>
