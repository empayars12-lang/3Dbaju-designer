<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pro Designer 3D - Studio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #121212; color: #f3f4f6; }
    
    /* Susun Atur Utama */
    #app { display: flex; height: 100vh; }
    
    /* PANEL KIRI (Warna & Upload) */
    #sidebar-left {
      width: 280px; background: #18181b; padding: 24px; display: flex; flex-direction: column; gap: 24px;
      border-right: 1px solid #27272a; z-index: 10; box-shadow: 4px 0 15px rgba(0,0,0,0.3);
    }
    .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: #a1a1aa; margin-bottom: 12px; }
    
    /* Grid Warna */
    .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .color-btn {
      aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.2s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .color-btn:hover { transform: scale(1.1); }
    .color-btn.active { border-color: #38bdf8; transform: scale(1.1); box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    
    /* Custom Color */
    .custom-color-wrapper { display: flex; align-items: center; gap: 12px; background: #27272a; padding: 8px 12px; border-radius: 8px; border: 1px solid #3f3f46;}
    .custom-color-wrapper input[type="color"] { width: 32px; height: 32px; border: none; background: none; cursor: pointer; border-radius: 4px; }
    .custom-color-wrapper span { font-size: 13px; color: #d4d4d8; }

    /* Butang Upload */
    .upload-btn {
      background: #38bdf8; color: #000; text-align: center; padding: 14px; border-radius: 8px;
      font-weight: 600; font-size: 14px; cursor: pointer; position: relative; overflow: hidden; transition: 0.2s;
      box-shadow: 0 4px 10px rgba(56, 189, 248, 0.2);
    }
    .upload-btn:hover { background: #0ea5e9; transform: translateY(-2px); }
    .upload-btn input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    /* Butang Save */
    .save-btn {
      margin-top: auto; background: #10b981; color: #fff; border: none; padding: 16px;
      border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
    }
    .save-btn:hover { background: #059669; transform: translateY(-2px); }

    /* KAWASAN 3D (TENGAH) */
    #viewer-container { flex: 1; position: relative; background: radial-gradient(circle at center, #27272a 0%, #09090b 100%); overflow: hidden; }
    #viewer-container canvas { display: block; }

    /* PANEL KANAN (LAYERS) */
    #sidebar-right {
      width: 260px; background: #18181b; border-left: 1px solid #27272a; z-index: 10;
      display: flex; flex-direction: column; box-shadow: -4px 0 15px rgba(0,0,0,0.3);
    }
    #layers-header { padding: 24px 24px 16px 24px; border-bottom: 1px solid #27272a; }
    #layers-header h2 { font-size: 13px; font-weight: 600; color: #e4e4e7; text-transform: uppercase; letter-spacing: 1px;}
    
    #layers-list { flex: 1; overflow-y: auto; }
    .layer-item {
      padding: 14px 24px; border-bottom: 1px solid #27272a; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      transition: 0.2s; font-size: 13px; color: #d4d4d8;
    }
    .layer-item:hover { background: #27272a; }
    .layer-item.active { background: rgba(56, 189, 248, 0.1); border-left: 3px solid #38bdf8; color: #38bdf8; font-weight: 600;}
    .layer-info { display: flex; align-items: center; gap: 12px; }
    .layer-icon { font-size: 16px; }
    
    /* Delete Button */
    .delete-btn { color: #ef4444; font-size: 14px; font-weight: bold; opacity: 0; transition: 0.2s; padding: 4px;}
    .layer-item:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { transform: scale(1.2); }

    /* Loading Screen */
    #loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #09090b; color: #38bdf8; z-index: 100; font-weight: 600; letter-spacing: 2px;
      transition: opacity 0.5s;
    }

    /* Responsive (Mobile) */
    @media (max-width: 900px) {
      #app { flex-direction: column; }
      #sidebar-left { width: 100%; height: auto; flex-direction: row; align-items: center; justify-content: space-between; padding: 12px; border-right: none; border-bottom: 1px solid #27272a; }
      #sidebar-left .section-title, .custom-color-wrapper { display: none; }
      .color-grid { display: flex; gap: 8px; margin: 0; }
      .color-btn { width: 32px; height: 32px; }
      .upload-btn { padding: 10px 16px; font-size: 12px; margin: 0 10px;}
      .save-btn { padding: 10px 16px; font-size: 12px; margin: 0; }
      
      #sidebar-right { width: 100%; height: 120px; border-left: none; border-top: 1px solid #27272a; flex-direction: row; }
      #layers-header { display: none; }
      #layers-list { display: flex; overflow-x: auto; }
      .layer-item { border-bottom: none; border-right: 1px solid #27272a; white-space: nowrap; padding: 10px 15px; }
    }
  </style>
</head>
<body>

<div id="app">
  <!-- KIRI: TOOLS -->
  <div id="sidebar-left">
    <div>
      <div class="section-title">Warna Baju</div>
      <div class="color-grid" id="colorGrid"></div>
      <div class="custom-color-wrapper" style="margin-top: 12px;">
        <input type="color" id="customColor" value="#ffffff">
        <span>Warna Custom</span>
      </div>
    </div>
    
    <div>
      <div class="section-title">Design Anda</div>
      <div class="upload-btn">
        + Tambah Logo
        <input type="file" id="logoUpload" accept="image/*" multiple>
      </div>
    </div>
    
    <button class="save-btn" onclick="saveImage()">⬇️ Simpan Design</button>
  </div>
  
  <!-- TENGAH: 3D VIEWER -->
  <div id="viewer-container">
    <div id="loading">MEMUATKAN STUDIO...</div>
  </div>

  <!-- KANAN: LAYERS -->
  <div id="sidebar-right">
    <div id="layers-header">
      <h2>Senarai Layer</h2>
    </div>
    <div id="layers-list">
      <!-- Layer akan dijana di sini -->
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

// ===== SETUP ASAS THREE.JS =====
const container = document.getElementById('viewer-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

// Lampu Studio (Buat baju nampak real)
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
mainLight.position.set(5, 10, 7);
scene.add(mainLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 1);
fillLight.position.set(-5, 5, -5);
scene.add(fillLight);
const backLight = new THREE.DirectionalLight(0xffffff, 1);
backLight.position.set(0, 5, -10);
scene.add(backLight);

// Kawalan Kamera
const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false;
controls.minDistance = 2;
controls.maxDistance = 10;

// ===== GIZMO KAWALAN (TRANSFORM CONTROLS) =====
const transformControls = new TransformControls(camera, renderer.domElement);
transformControls.setMode('translate');
transformControls.showZ = false; // Kunci Z supaya tak terapung
transformControls.setSize(0.8);
scene.add(transformControls);

// Matikan pusing kamera bila guna Gizmo
transformControls.addEventListener('dragging-changed', (event) => {
  controls.enabled = !event.value;
});

// ===== SISTEM LAYER & GROUP =====
const shirtGroup = new THREE.Group(); // Induk (Parent) untuk baju & logo
scene.add(shirtGroup);

let shirtMesh = null;
let shirtMaterials = [];
let activeObject = null;

// ===== LOAD MODEL 3D =====
const loader = new GLTFLoader();
const MODEL_URL = './T_shirt_gltf.gltf'; // Pastikan nama fail betul

loader.load(MODEL_URL, (gltf) => {
  shirtMesh = gltf.scene;
  
  // Auto-fit saiz baju
  const box = new THREE.Box3().setFromObject(shirtMesh);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxSize = Math.max(size.x, size.y, size.z);
  const scaleFactor = 2.5 / maxSize; 
  
  shirtMesh.scale.set(scaleFactor, scaleFactor, scaleFactor);
  shirtMesh.position.set(-center.x * scaleFactor, -center.y * scaleFactor, -center.z * scaleFactor);
  
  camera.position.set(0, 0, maxSize * 1.8);
  controls.update();

  // Setup Material Baju
  shirtMesh.traverse((child) => {
    if (child.isMesh) {
      child.material = new THREE.MeshStandardMaterial({ 
        color: '#ffffff', 
        roughness: 0.8,
        metalness: 0.1
      });
      shirtMaterials.push(child.material);
    }
  });
  
  shirtGroup.add(shirtMesh);
  document.getElementById('loading').style.opacity = '0';
  setTimeout(() => document.getElementById('loading').style.display = 'none', 500);

  // Daftarkan Baju 3D dalam sistem Layer
  addLayer('Baju 3D', '👕', shirtGroup, true);

}, undefined, (error) => {
  console.error('Error:', error);
  document.getElementById('loading').innerText = 'Gagal memuatkan fail baju.';
});

// ===== SISTEM UI LAYER =====
const layerListUI = document.getElementById('layers-list');
let layerCount = 0;

function addLayer(name, icon, object, isShirt = false) {
  const id = 'layer-' + Date.now() + Math.random().toString(36).substr(2, 5);
  object.userData.layerId = id;
  object.userData.isShirt = isShirt;

  // Buat elemen HTML
  const el = document.createElement('div');
  el.className = 'layer-item';
  el.id = id;
  
  el.innerHTML = `
    <div class="layer-info">
      <span class="layer-icon">${icon}</span> 
      <span>${name}</span>
    </div>
    ${!isShirt ? '<span class="delete-btn" title="Padam Layer">✕</span>' : ''}
  `;

  // Event klik untuk pilih layer
  el.addEventListener('click', (e) => {
    // Abaikan jika yang diklik adalah butang padam
    if(e.target.classList.contains('delete-btn')) return;

    document.querySelectorAll('.layer-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    
    // Pasang Gizmo pada objek
    activeObject = object;
    transformControls.attach(activeObject);
  });

  // Event butang padam
  if(!isShirt) {
    el.querySelector('.delete-btn').addEventListener('click', () => {
      // Buang dari 3D Scene
      shirtGroup.remove(object);
      // Dispose material & geometry untuk elak memory leak
      object.geometry.dispose();
      object.material.dispose();
      // Buang UI
      el.remove();
      // Detach Gizmo jika objek ni tengah dipilih
      if(activeObject === object) {
        transformControls.detach();
        activeObject = null;
      }
    });
  }

  // Letak layer baru di paling atas
  layerListUI.insertBefore(el, layerListUI.firstChild);
  
  // Auto-pilih layer baju bila kali pertama load
  if(isShirt) el.click();
}

// ===== UPLOAD LOGO & AUTO-PLACEMENT (RAYCAST) =====
document.getElementById('logoUpload').addEventListener('change', (e) => {
  const files = e.target.files;
  for (let i = 0; i < files.length; i++) {
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        layerCount++;
        createLogo(event.target.result, `Logo ${layerCount}`);
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(files[i]);
  }
  e.target.value = ''; // Reset input
});

function createLogo(imageUrl, name) {
  const texture = new THREE.TextureLoader().load(imageUrl);
  texture.colorSpace = THREE.SRGBColorSpace;

  // Kira nisbah aspek gambar
  const aspect = texture.image.width / texture.image.height;
  const baseWidth = 0.6; // Saiz asal
  const baseHeight = baseWidth / aspect;

  const geo = new THREE.PlaneGeometry(baseWidth, baseHeight);
  const mat = new THREE.MeshBasicMaterial({ 
    map: texture, 
    transparent: true, 
    depthTest: false, // Pastikan sentiasa nampak di depan
    depthWrite: false 
  });
  
  const logo = new THREE.Mesh(geo, mat);

  // TEKNIK RAYCAST: Tembak laser dari kamera ke tengah skrin
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera); // 0,0 ialah tengah skrin
  
  // Tembak ke arah baju
  const intersects = raycaster.intersectObject(shirtMesh, true);

  if (intersects.length > 0) {
    // Letak logo tepat pada titik yang terkena laser
    logo.position.copy(intersects[0].point);
    // Anjak sedikit ke depan supaya tak 'tenggelam' dalam baju
    logo.position.z += 0.05; 
    // Naik sikit ke arah dada
    logo.position.y += 0.1;
  } else {
    // Jika tak jumpa baju (contoh kamera pusing), letak di tengah
    logo.position.set(0, 0, 1.5); 
  }

  // Masukkan logo ke dalam Group Baju (supaya bergerak serentak)
  shirtGroup.add(logo);
  
  // Daftar dalam sistem Layer
  addLayer(name, '🖼️', logo, false);
}

// ===== TUKAR WARNA BAJU =====
const colors = ['#ffffff', '#171717', '#64748b', '#dc2626', '#2563eb', '#16a34a', '#ca8a04', '#9333ea'];
const colorGrid = document.getElementById('colorGrid');
colors.forEach((hex, i) => {
  const btn = document.createElement('button');
  btn.className = 'color-btn' + (i === 0 ? ' active' : '');
  btn.style.background = hex;
  btn.onclick = () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    shirtMaterials.forEach(mat => mat.color.set(hex));
  };
  colorGrid.appendChild(btn);
});

// Custom Color Picker
document.getElementById('customColor').addEventListener('input', (e) => {
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
  shirtMaterials.forEach(mat => mat.color.set(e.target.value));
});

// ===== SIMPAN GAMBAR =====
window.saveImage = function() {
  // Sembunyikan Gizmo & Layer UI sementara
  transformControls.visible = false;
  document.querySelectorAll('.layer-item').forEach(i => i.classList.remove('active')); // Hilangkan highlight
  
  renderer.render(scene, camera);
  const dataURL = renderer.domElement.toDataURL('image/png');
  
  transformControls.visible = true;
  
  const link = document.createElement('a');
  link.download = 'design-baju-profesional.png';
  link.href = dataURL;
  link.click();
};

// ===== RENDER LOOP =====
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ===== RESPONSIVE RESIZE =====
window.addEventListener('resize', () => {
  const width = container.clientWidth;
  const height = container.clientHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
});
</script>

</body>
</html>
