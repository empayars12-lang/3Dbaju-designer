<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pro Designer 3D - Studio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #121212; color: #f3f4f6; }
    
    #app { display: flex; height: 100vh; }
    
    #sidebar-left {
      width: 300px; background: #18181b; padding: 24px; display: flex; flex-direction: column; gap: 20px;
      border-right: 1px solid #27272a; z-index: 10; box-shadow: 4px 0 15px rgba(0,0,0,0.3); overflow-y: auto;
    }
    .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: #a1a1aa; margin-bottom: 12px; }
    
    .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .color-btn { aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .color-btn:hover { transform: scale(1.1); }
    .color-btn.active { border-color: #38bdf8; transform: scale(1.1); box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    
    .custom-color-wrapper { display: flex; align-items: center; gap: 12px; background: #27272a; padding: 8px 12px; border-radius: 8px; border: 1px solid #3f3f46; margin-top: 12px;}
    .custom-color-wrapper input[type="color"] { width: 32px; height: 32px; border: none; background: none; cursor: pointer; border-radius: 4px; }
    .custom-color-wrapper span { font-size: 13px; color: #d4d4d8; }

    .upload-btn {
      background: #38bdf8; color: #000; text-align: center; padding: 14px; border-radius: 8px;
      font-weight: 600; font-size: 14px; cursor: pointer; position: relative; overflow: hidden; transition: 0.2s;
      box-shadow: 0 4px 10px rgba(56, 189, 248, 0.2);
    }
    .upload-btn:hover { background: #0ea5e9; transform: translateY(-2px); }
    .upload-btn input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    .text-input-group { display: flex; gap: 8px; margin-bottom: 8px; }
    .text-input-group input[type="text"] { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #3f3f46; background: #27272a; color: #fff; font-family: inherit; font-size: 13px; }
    .text-input-group input[type="color"] { width: 40px; height: 40px; border: none; background: #27272a; border-radius: 6px; cursor: pointer; padding: 2px; }
    .add-text-btn { background: #27272a; color: #d4d4d8; border: 1px solid #3f3f46; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; }
    .add-text-btn:hover { background: #3f3f46; }

    .gizmo-controls { display: none; background: #27272a; padding: 12px; border-radius: 8px; border: 1px solid #3f3f46; }
    .gizmo-controls.active { display: block; }
    .mode-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .mode-btn { background: #3f3f46; border: none; color: #d4d4d8; padding: 10px 4px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: inherit; }
    .mode-btn:hover { background: #52525b; }
    .mode-btn.active { background: #38bdf8; color: #000; }

    .action-row { display: flex; gap: 8px; margin-top: 8px; }
    .action-btn {
      flex: 1; background: #3f3f46; color: #d4d4d8; border: 1px solid #52525b; padding: 10px;
      border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .action-btn:hover { background: #52525b; }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .hint {
      font-size: 11px; color: #71717a; margin-top: 8px; line-height: 1.45;
    }

    .save-btn {
      margin-top: auto; background: #10b981; color: #fff; border: none; padding: 16px;
      border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
    }
    .save-btn:hover { background: #059669; transform: translateY(-2px); }

    #viewer-container { flex: 1; position: relative; background: radial-gradient(circle at center, #27272a 0%, #09090b 100%); overflow: hidden; }
    #viewer-container canvas { display: block; }

    #view-toggles {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; background: rgba(24, 24, 27, 0.85); padding: 8px; border-radius: 12px; backdrop-filter: blur(10px);
    }
    #view-toggles button { background: #3f3f46; color: #fff; border: none; padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; transition: 0.2s; }
    #view-toggles button:hover { background: #52525b; }
    #view-toggles button.active { background: #38bdf8; color: #000; }

    #sidebar-right {
      width: 280px; background: #18181b; border-left: 1px solid #27272a; z-index: 10;
      display: flex; flex-direction: column; box-shadow: -4px 0 15px rgba(0,0,0,0.3);
    }
    #layers-header { padding: 24px 24px 16px 24px; border-bottom: 1px solid #27272a; }
    #layers-header h2 { font-size: 13px; font-weight: 600; color: #e4e4e7; text-transform: uppercase; letter-spacing: 1px;}
    
    #layers-list { flex: 1; overflow-y: auto; }
    .layer-item { padding: 14px 24px; border-bottom: 1px solid #27272a; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; font-size: 13px; color: #d4d4d8; }
    .layer-item:hover { background: #27272a; }
    .layer-item.active { background: rgba(56, 189, 248, 0.1); border-left: 3px solid #38bdf8; color: #38bdf8; font-weight: 600;}
    .layer-info { display: flex; align-items: center; gap: 12px; }
    .layer-icon { font-size: 16px; }
    
    .delete-btn { color: #ef4444; font-size: 14px; font-weight: bold; opacity: 0; transition: 0.2s; padding: 4px; background: none; border: none; cursor: pointer;}
    .layer-item:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { transform: scale(1.2); }

    #loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #09090b; color: #38bdf8; z-index: 100; font-weight: 600; letter-spacing: 2px; transition: opacity 0.5s;
    }
  </style>
</head>
<body>

<div id="app">
  <div id="sidebar-left">
    <div>
      <div class="section-title">Warna Baju</div>
      <div class="color-grid" id="colorGrid"></div>
      <div class="custom-color-wrapper">
        <input type="color" id="customColor" value="#ffffff">
        <span>Warna Custom</span>
      </div>
    </div>
    
    <div>
      <div class="section-title">Design Anda</div>
      <div class="upload-btn">
        + Tambah Logo
        <input type="file" id="logoUpload" accept="image/*" multiple>
      </div>
    </div>

    <div>
      <div class="section-title">Tambah Teks</div>
      <div class="text-input-group">
        <input type="text" id="textInput" placeholder="Taip teks...">
        <input type="color" id="textColor" value="#000000">
      </div>
      <button class="add-text-btn" id="addTextBtn">Tambah Teks</button>
    </div>

    <div class="gizmo-controls" id="gizmoControls">
      <div class="section-title" style="margin-bottom: 0;">Kawalan Logo</div>
      <div class="mode-buttons">
        <button class="mode-btn active" id="btnTranslate" title="Gerak">✥ Gerak</button>
        <button class="mode-btn" id="btnScale" title="Saiz">⤢ Saiz</button>
        <button class="mode-btn" id="btnRotate" title="Putar">⟳ Putar</button>
      </div>
      <div class="hint">
        • <b>Gerak</b>: tarik logo pada baju (termasuk lengan)<br>
        • <b>Saiz</b>: tarik kotak putih di hujung gizmo<br>
        • <b>Putar</b>: tarik busur kuning untuk putar
      </div>
      <div class="action-row">
        <button class="action-btn" id="btnUndo" title="Ctrl+Z">↶ Undo</button>
        <button class="action-btn" id="btnRedo" title="Ctrl+Y">↷ Redo</button>
      </div>
    </div>
    
    <button class="save-btn" id="saveBtn">⬇️ Simpan Design HD</button>
  </div>
  
  <div id="viewer-container">
    <div id="loading">MEMUATKAN STUDIO...</div>
    <div id="view-toggles">
      <button id="viewFront" class="active">Hadapan</button>
      <button id="viewBack">Belakang</button>
      <button id="viewRight">Sisi Kanan</button>
      <button id="viewLeft">Sisi Kiri</button>
    </div>
  </div>

  <div id="sidebar-right">
    <div id="layers-header"><h2>Senarai Layer</h2></div>
    <div id="layers-list"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ===== 1. SETUP ASAS =====
const container = document.getElementById('viewer-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(0, 0, 4.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const mainLight = new THREE.DirectionalLight(0xffffff, 2.2);
mainLight.position.set(5, 10, 5);
mainLight.castShadow = true;
mainLight.shadow.mapSize.set(2048, 2048);
scene.add(mainLight);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.ShadowMaterial({ opacity: 0.3 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.2;
ground.receiveShadow = true;
scene.add(ground);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 1.5;
controls.maxDistance = 10;

const transformControls = new TransformControls(camera, renderer.domElement);
transformControls.setMode('translate');
transformControls.setSize(0.9);
transformControls.setSpace('local');
const transformHelper = transformControls.getHelper();
scene.add(transformHelper);

// Lumpuhkan orbit semasa gizmo diguna
let isDragging = false;
transformControls.addEventListener('dragging-changed', (event) => {
  controls.enabled = !event.value;
  isDragging = event.value;
  if (!event.value && activeDummy) {
    snapToSurface(activeDummy);
    pushHistory();
    saveToLocalStorage();
  }
});

// ===== 2. STATE =====
const shirtGroup = new THREE.Group();
scene.add(shirtGroup);

let shirtMeshes = [];
let shirtMaterials = [];
let layers = [];
let activeDummy = null;
let logoCount = 0;
let currentShirtColor = '#ffffff';

let history = [];
let historyIndex = -1;
const MAX_HISTORY = 40;

const raycaster = new THREE.Raycaster();
const layerListUI = document.getElementById('layers-list');
const gizmoControlsUI = document.getElementById('gizmoControls');
const btnUndo = document.getElementById('btnUndo');
const btnRedo = document.getElementById('btnRedo');

// ===== 3. LOAD MODEL =====
new GLTFLoader().load('./T_shirt_gltf.gltf', 
  (gltf) => setupShirt(gltf.scene), 
  undefined, 
  (err) => {
    console.error(err);
    document.getElementById('loading').innerText = 'Gagal memuatkan fail baju.';
  }
);

function setupShirt(model) {
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  model.scale.setScalar(2.4 / maxDim);
  model.updateMatrixWorld(true);

  box.setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(center);
  model.updateMatrixWorld(true);

  model.traverse((child) => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
      const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, metalness: 0.1 });
      child.material = mat;
      shirtMaterials.push(mat);
      shirtMeshes.push(child);
    }
  });

  shirtGroup.add(model);
  ground.position.y = box.min.y - 0.1;

  finishLoading();
  addBaseLayer();
  loadFromLocalStorage();
}

function finishLoading() {
  const el = document.getElementById('loading');
  el.style.opacity = '0';
  setTimeout(() => el.remove(), 500);
}

// ===== 4. LAYER UI =====
function addBaseLayer() {
  const el = document.createElement('div');
  el.className = 'layer-item active';
  el.id = 'layer-base';
  el.innerHTML = `<div class="layer-info"><span class="layer-icon">👕</span> <span>Baju 3D (Asas)</span></div>`;
  el.onclick = () => {
    transformControls.detach();
    activeDummy = null;
    gizmoControlsUI.classList.remove('active');
    document.querySelectorAll('.layer-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
  };
  layerListUI.appendChild(el);
}

function addDesignLayer(dummy, name, icon) {
  const id = 'layer-' + Date.now() + Math.random().toString(36).substr(2, 5);
  dummy.userData.layerId = id;
  dummy.userData.name = name;
  dummy.userData.icon = icon;

  const el = document.createElement('div');
  el.className = 'layer-item';
  el.id = id;
  
  el.innerHTML = `
    <div class="layer-info">
      <span class="layer-icon">${icon}</span> 
      <span>${name}</span>
    </div>
    <button class="delete-btn" title="Padam">✕</button>
  `;

  el.onclick = (e) => {
    if (e.target.closest('.delete-btn')) return;
    selectLayer(dummy, el);
  };

  el.querySelector('.delete-btn').onclick = (e) => {
    e.stopPropagation();
    deleteLayer(dummy, el);
  };

  layerListUI.prepend(el);
  selectLayer(dummy, el);
}

function selectLayer(dummy, el) {
  document.querySelectorAll('.layer-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  activeDummy = dummy;
  transformControls.attach(dummy);
  gizmoControlsUI.classList.add('active');
}

function deleteLayer(dummy, el) {
  transformControls.detach();
  if (dummy.userData.plane) {
    shirtGroup.remove(dummy.userData.plane);
    dummy.userData.plane.geometry.dispose();
    if (dummy.userData.plane.material.map) dummy.userData.plane.material.map.dispose();
    dummy.userData.plane.material.dispose();
  }
  if (dummy.userData.texture) dummy.userData.texture.dispose();
  shirtGroup.remove(dummy);
  el.remove();
  layers = layers.filter(l => l !== dummy);
  gizmoControlsUI.classList.remove('active');
  activeDummy = null;
  pushHistory();
  saveToLocalStorage();
}

// ===== 5. PLANE LOGO SYSTEM (ganti Decal) =====
function createLogoPlane(dummy) {
  // Buang plane lama jika ada
  if (dummy.userData.plane) {
    shirtGroup.remove(dummy.userData.plane);
    dummy.userData.plane.geometry.dispose();
    dummy.userData.plane.material.dispose();
  }

  const aspect = dummy.userData.aspect || 1;
  const baseSize = 0.45; // saiz asas
  const w = baseSize * dummy.scale.x;
  const h = (baseSize / aspect) * dummy.scale.y;

  const geo = new THREE.PlaneGeometry(w, h);
  const mat = new THREE.MeshStandardMaterial({
    map: dummy.userData.texture,
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
    polygonOffset: true,
    polygonOffsetFactor: -2,
    roughness: 0.7,
    metalness: 0.0
  });

  const plane = new THREE.Mesh(geo, mat);
  plane.renderOrder = 10;
  plane.position.copy(dummy.position);
  plane.quaternion.copy(dummy.quaternion);
  // Sedikit angkat dari permukaan supaya tak z-fighting
  const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(dummy.quaternion);
  plane.position.add(normal.multiplyScalar(0.008));

  shirtGroup.add(plane);
  dummy.userData.plane = plane;
}

// Snap logo ke permukaan baju (penting untuk lengan)
function snapToSurface(dummy) {
  if (!shirtMeshes.length) return;

  // Ray dari sedikit di depan logo ke arah -normal
  const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(dummy.quaternion).normalize();
  const origin = dummy.position.clone().add(normal.clone().multiplyScalar(0.15));
  raycaster.set(origin, normal.clone().negate());

  const hits = raycaster.intersectObjects(shirtMeshes, true);
  if (hits.length > 0) {
    const hit = hits[0];
    const localHit = shirtGroup.worldToLocal(hit.point.clone());
    dummy.position.copy(localHit);

    // Orient ikut normal permukaan
    const worldNormal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld).normalize();
    const localNormal = worldNormal.clone().transformDirection(new THREE.Matrix4().copy(shirtGroup.matrixWorld).invert()).normalize();

    // Bina basis
    const up = new THREE.Vector3(0, 1, 0);
    let right = new THREE.Vector3().crossVectors(up, localNormal);
    if (right.lengthSq() < 0.001) right.set(1, 0, 0);
    right.normalize();
    const actualUp = new THREE.Vector3().crossVectors(localNormal, right).normalize();

    const matrix = new THREE.Matrix4().makeBasis(right, actualUp, localNormal);
    dummy.quaternion.setFromRotationMatrix(matrix);
  }

  createLogoPlane(dummy);
}

// Semasa gizmo bergerak
transformControls.addEventListener('objectChange', () => {
  if (!activeDummy) return;

  if (transformControls.getMode() === 'translate') {
    // Semasa drag, cuba snap secara lembut
    activeDummy.updateMatrixWorld();
    const worldPos = new THREE.Vector3().setFromMatrixPosition(activeDummy.matrixWorld);
    const dir = worldPos.clone().sub(camera.position).normalize();
    raycaster.set(camera.position, dir);
    const hits = raycaster.intersectObjects(shirtMeshes, true);

    if (hits.length > 0) {
      const hit = hits[0];
      const localHit = shirtGroup.worldToLocal(hit.point.clone());
      activeDummy.position.copy(localHit);

      if (isDragging) {
        const worldNormal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld).normalize();
        const localNormal = worldNormal.clone().transformDirection(new THREE.Matrix4().copy(shirtGroup.matrixWorld).invert()).normalize();

        const up = new THREE.Vector3(0, 1, 0);
        let right = new THREE.Vector3().crossVectors(up, localNormal);
        if (right.lengthSq() < 0.001) right.set(1, 0, 0);
        right.normalize();
        const actualUp = new THREE.Vector3().crossVectors(localNormal, right).normalize();

        const matrix = new THREE.Matrix4().makeBasis(right, actualUp, localNormal);
        activeDummy.quaternion.setFromRotationMatrix(matrix);
      }
    }
  }

  // Update plane (scale & rotation terus ikut dummy)
  createLogoPlane(activeDummy);
});

// ===== 6. TAMBAH LOGO / TEKS =====
document.getElementById('logoUpload').addEventListener('change', (e) => {
  const files = e.target.files;
  if (!files.length) return;

  for (let i = 0; i < files.length; i++) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const texture = new THREE.Texture(img);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.needsUpdate = true;
        addLogoToScene(texture, img.width / img.height, false, ev.target.result);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(files[i]);
  }
  e.target.value = '';
});

document.getElementById('addTextBtn').onclick = () => {
  const text = document.getElementById('textInput').value.trim();
  const color = document.getElementById('textColor').value;
  if (!text) return;

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 1024;
  canvas.height = 256;
  ctx.fillStyle = color;
  ctx.font = "bold 120px Inter, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, 512, 128);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const dataURL = canvas.toDataURL('image/png');
  addLogoToScene(texture, canvas.width / canvas.height, true, dataURL, text, color);
  document.getElementById('textInput').value = '';
};

function addLogoToScene(texture, aspect, isText = false, dataURL = null, textContent = '', textColor = '#000000') {
  const dummy = new THREE.Object3D();
  dummy.userData.texture = texture;
  dummy.userData.aspect = aspect;
  dummy.userData.isText = isText;
  dummy.userData.dataURL = dataURL;
  dummy.userData.textContent = textContent;
  dummy.userData.textColor = textColor;
  dummy.scale.set(1, 1, 1);
  shirtGroup.add(dummy);

  // Letak awal di hadapan
  const offsetX = (logoCount % 2 === 0) ? 0.1 : -0.1;
  const offsetY = Math.floor(logoCount / 2) * -0.15;

  raycaster.setFromCamera(new THREE.Vector2(offsetX, offsetY), camera);
  const hits = raycaster.intersectObjects(shirtMeshes, true);

  if (hits.length > 0) {
    const hit = hits[0];
    const localHit = shirtGroup.worldToLocal(hit.point.clone());
    dummy.position.copy(localHit);

    const worldNormal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld).normalize();
    const localNormal = worldNormal.clone().transformDirection(new THREE.Matrix4().copy(shirtGroup.matrixWorld).invert()).normalize();

    const up = new THREE.Vector3(0, 1, 0);
    let right = new THREE.Vector3().crossVectors(up, localNormal);
    if (right.lengthSq() < 0.001) right.set(1, 0, 0);
    right.normalize();
    const actualUp = new THREE.Vector3().crossVectors(localNormal, right).normalize();

    const matrix = new THREE.Matrix4().makeBasis(right, actualUp, localNormal);
    dummy.quaternion.setFromRotationMatrix(matrix);
  } else {
    dummy.position.set(0, 0.15, 0.45);
  }

  logoCount++;
  createLogoPlane(dummy);
  layers.push(dummy);

  const layerName = isText ? `Teks ${logoCount}` : `Logo ${logoCount}`;
  const icon = isText ? '📝' : '🖼️';
  addDesignLayer(dummy, layerName, icon);
  
  pushHistory();
  saveToLocalStorage();
}

// ===== 7. UI CONTROLS =====
document.getElementById('btnTranslate').onclick = (e) => {

  e.target.classList.add('active');
};
document.getElementById('btnRotate').onclick = (e) => {

// Warna
const colors = ['#ffffff', '#171717', '#64748b', '#dc2626', '#2563eb', '#16a34a', '#ca8a04', '#9333ea'];
const colorGrid = document.getElementById('colorGrid');
colors.forEach((hex, i) => {
  const btn = document.createElement('button');
  btn.className = 'color-btn' + (i === 0 ? ' active' : '');
  btn.style.background = hex;
  btn.onclick = () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentShirtColor = hex;
    shirtMaterials.forEach(m => m.color.set(hex));

    saveToLocalStorage();
  };

});

document.getElementById('customColor').addEventListener('input', (e) => {
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
  currentShirtColor = e.target.value;
  shirtMaterials.forEach(m => m.color.set(e.target.value));
});
document.getElementById('customColor').addEventListener('change', () => {
  pushHistory();
  saveToLocalStorage();
});

// ===== 8. UNDO / REDO =====
function getCurrentState() {
  return {
    color: currentShirtColor,
    layers: layers.map(d => ({
      position: d.position.toArray(),
      quaternion: d.quaternion.toArray(),
      scale: d.scale.toArray(),
      aspect: d.userData.aspect,
      isText: d.userData.isText,
      dataURL: d.userData.dataURL,
      textContent: d.userData.textContent,
      textColor: d.userData.textColor,
      name: d.userData.name,
      icon: d.userData.icon
    }))
  };
}

function pushHistory() {
  if (historyIndex < history.length - 1) {
    history = history.slice(0, historyIndex + 1);
  }
  history.push(getCurrentState());
  if (history.length > MAX_HISTORY) history.shift();
  historyIndex = history.length - 1;
  updateUndoRedoButtons();
}

function restoreState(state) {
  // Clear existing
  [...layers].forEach(d => {
    if (d.userData.plane) {
      shirtGroup.remove(d.userData.plane);
      d.userData.plane.geometry.dispose();
      if (d.userData.plane.material.map) d.userData.plane.material.map.dispose();
      d.userData.plane.material.dispose();
    }
    if (d.userData.texture) d.userData.texture.dispose();
    shirtGroup.remove(d);
  });
  layers = [];
  logoCount = 0;

  [...layerListUI.children].forEach(el => {
    if (el.id !== 'layer-base') el.remove();
  });

  currentShirtColor = state.color || '#ffffff';
  shirtMaterials.forEach(m => m.color.set(currentShirtColor));
  document.getElementById('customColor').value = currentShirtColor;

  state.layers.forEach(ldata => {
    const img = new Image();
    img.onload = () => {
      const texture = new THREE.Texture(img);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;

      const dummy = new THREE.Object3D();
      dummy.userData.texture = texture;
      dummy.userData.aspect = ldata.aspect;
      dummy.userData.isText = ldata.isText;
      dummy.userData.dataURL = ldata.dataURL;
      dummy.userData.textContent = ldata.textContent;
      dummy.userData.textColor = ldata.textColor;
      dummy.userData.name = ldata.name;
      dummy.userData.icon = ldata.icon;

      dummy.position.fromArray(ldata.position);
      dummy.quaternion.fromArray(ldata.quaternion);
      dummy.scale.fromArray(ldata.scale);

      shirtGroup.add(dummy);
      createLogoPlane(dummy);
      layers.push(dummy);
      logoCount++;
      addDesignLayer(dummy, ldata.name, ldata.icon);
    };
    img.src = ldata.dataURL;
  });

  transformControls.detach();
  activeDummy = null;
  gizmoControlsUI.classList.remove('active');
  document.getElementById('layer-base')?.classList.add('active');
}

function undo() {
  if (historyIndex <= 0) return;
  historyIndex--;
  restoreState(history[historyIndex]);
  updateUndoRedoButtons();
  saveToLocalStorage();
}
function redo() {
  if (historyIndex >= history.length - 1) return;
  historyIndex++;
  restoreState(history[historyIndex]);
  updateUndoRedoButtons();
  saveToLocalStorage();
}
function updateUndoRedoButtons() {
  btnUndo.disabled = historyIndex <= 0;
  btnRedo.disabled = historyIndex >= history.length - 1;
}
btnUndo.onclick = undo;
btnRedo.onclick = redo;

window.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'z' || e.key === 'Z') {
      e.preventDefault();
      e.shiftKey ? redo() : undo();
    }
    if (e.key === 'y' || e.key === 'Y') {
      e.preventDefault();
      redo();
    }
  }
});

// ===== 9. LOCAL STORAGE =====
function saveToLocalStorage() {
  try {
    localStorage.setItem('proDesigner3D_state', JSON.stringify(getCurrentState()));
  } catch (err) {
    console.warn('Gagal simpan:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const raw = localStorage.getItem('proDesigner3D_state');
    if (!raw) { pushHistory(); return; }
    const state = JSON.parse(raw);
    if (state && state.layers) {
      restoreState(state);
      history = [state];
      historyIndex = 0;
      updateUndoRedoButtons();
    } else {
      pushHistory();
    }
  } catch (err) {
    console.warn('Gagal load:', err);
    pushHistory();
  }
}

// ===== 10. SIMPAN HD =====
document.getElementById('saveBtn').onclick = () => {

  const currentSize = renderer.getSize(new THREE.Vector2());
  renderer.setSize(2000, 2000, false);

  const link = document.createElement('a');

  link.href = dataURL;
  link.click();
};

// ===== 11. ANIMATE =====
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const width = container.clientWidth;
  const height = container.clientHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
});
