<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pro Designer 3D - Studio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #121212; color: #f3f4f6; }
    
    #app { display: flex; height: 100vh; }
    
    /* PANEL KIRI */
    #sidebar-left {
      width: 300px; background: #18181b; padding: 24px; display: flex; flex-direction: column; gap: 20px;
      border-right: 1px solid #27272a; z-index: 10; box-shadow: 4px 0 15px rgba(0,0,0,0.3); overflow-y: auto;
    }
    .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: #a1a1aa; margin-bottom: 12px; }
    
    .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .color-btn { aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .color-btn:hover { transform: scale(1.1); }
    .color-btn.active { border-color: #38bdf8; transform: scale(1.1); box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    
    .custom-color-wrapper { display: flex; align-items: center; gap: 12px; background: #27272a; padding: 8px 12px; border-radius: 8px; border: 1px solid #3f3f46; margin-top: 12px;}
    .custom-color-wrapper input[type="color"] { width: 32px; height: 32px; border: none; background: none; cursor: pointer; border-radius: 4px; }
    .custom-color-wrapper span { font-size: 13px; color: #d4d4d8; }

    .upload-btn {
      background: #38bdf8; color: #000; text-align: center; padding: 14px; border-radius: 8px;
      font-weight: 600; font-size: 14px; cursor: pointer; position: relative; overflow: hidden; transition: 0.2s;
      box-shadow: 0 4px 10px rgba(56, 189, 248, 0.2);
    }
    .upload-btn:hover { background: #0ea5e9; transform: translateY(-2px); }
    .upload-btn input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    .text-input-group { display: flex; gap: 8px; margin-bottom: 8px; }
    .text-input-group input[type="text"] { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #3f3f46; background: #27272a; color: #fff; font-family: inherit; font-size: 13px; }
    .text-input-group input[type="color"] { width: 40px; height: 40px; border: none; background: #27272a; border-radius: 6px; cursor: pointer; padding: 2px; }
    .add-text-btn { background: #27272a; color: #d4d4d8; border: 1px solid #3f3f46; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; }
    .add-text-btn:hover { background: #3f3f46; }

    .gizmo-controls { display: none; background: #27272a; padding: 12px; border-radius: 8px; border: 1px solid #3f3f46; }
    .gizmo-controls.active { display: block; }
    .mode-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .mode-btn { background: #3f3f46; border: none; color: #d4d4d8; padding: 10px 4px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: inherit; }
    .mode-btn:hover { background: #52525b; }
    .mode-btn.active { background: #38bdf8; color: #000; }

    /* PANEL KESAN IMEJ */
    .image-props {
      display: none;
      background: #27272a; padding: 12px;
      border-radius: 8px; border: 1px solid #3f3f46;
    }
    .image-props.active { display: block; }
    .prop-group { margin-bottom: 12px; }
    .prop-group:last-child { margin-bottom: 0; }
    .prop-label {
      font-size: 11px; color: #d4d4d8; display: block;
      margin-bottom: 6px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .prop-row { display: flex; align-items: center; gap: 8px; }
    .prop-row input[type="color"] {
      width: 30px; height: 30px; flex-shrink: 0;
      border: none; border-radius: 6px; background: #3f3f46;
      cursor: pointer; padding: 2px;
    }
    .prop-row input[type="range"] { flex: 1; accent-color: #38bdf8; min-width: 0; }
    .prop-val {
      font-size: 11px; color: #a1a1aa;
      width: 34px; text-align: right; font-variant-numeric: tabular-nums;
    }
    .prop-row-inline { display: flex; gap: 8px; margin-top: 6px; }
    .prop-row-inline label {
      flex: 1; font-size: 11px; color: #a1a1aa;
      display: flex; align-items: center; gap: 4px;
    }
    .prop-row-inline input[type="range"] { flex: 1; accent-color: #38bdf8; min-width: 0; }

    .save-btn {
      margin-top: auto; background: #10b981; color: #fff; border: none; padding: 16px;
      border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
    }
    .save-btn:hover { background: #059669; transform: translateY(-2px); }

    #viewer-container { flex: 1; position: relative; background: radial-gradient(circle at center, #27272a 0%, #09090b 100%); overflow: hidden; }
    #viewer-container canvas { display: block; }

    #view-toggles {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; background: rgba(24, 24, 27, 0.8); padding: 8px; border-radius: 12px; backdrop-filter: blur(10px);
    }
    #view-toggles button { background: #3f3f46; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; transition: 0.2s; }
    #view-toggles button:hover { background: #52525b; }

    #sidebar-right {
      width: 280px; background: #18181b; border-left: 1px solid #27272a; z-index: 10;
      display: flex; flex-direction: column; box-shadow: -4px 0 15px rgba(0,0,0,0.3);
    }
    #layers-header { padding: 24px 24px 16px 24px; border-bottom: 1px solid #27272a; }
    #layers-header h2 { font-size: 13px; font-weight: 600; color: #e4e4e7; text-transform: uppercase; letter-spacing: 1px;}
    
    #layers-list { flex: 1; overflow-y: auto; }
    .layer-item { padding: 14px 24px; border-bottom: 1px solid #27272a; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; font-size: 13px; color: #d4d4d8; }
    .layer-item:hover { background: #27272a; }
    .layer-item.active { background: rgba(56, 189, 248, 0.1); border-left: 3px solid #38bdf8; color: #38bdf8; font-weight: 600;}
    .layer-info { display: flex; align-items: center; gap: 12px; }
    .layer-icon { font-size: 16px; }
    
    .delete-btn { color: #ef4444; font-size: 14px; font-weight: bold; opacity: 0; transition: 0.2s; padding: 4px; background: none; border: none; cursor: pointer;}
    .layer-item:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { transform: scale(1.2); }

    #loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #09090b; color: #38bdf8; z-index: 100; font-weight: 600; letter-spacing: 2px; transition: opacity 0.5s;
    }
  </style>
</head>
<body>

<div id="app">
  <div id="sidebar-left">
    <div>
      <div class="section-title">Warna Baju</div>
      <div class="color-grid" id="colorGrid"></div>
      <div class="custom-color-wrapper">
        <input type="color" id="customColor" value="#ffffff">
        <span>Warna Custom</span>
      </div>
    </div>
    
    <div>
      <div class="section-title">Design Anda</div>
      <div class="upload-btn">
        + Tambah Logo
        <input type="file" id="logoUpload" accept="image/*" multiple>
      </div>
    </div>

    <div>
      <div class="section-title">Tambah Teks</div>
      <div class="text-input-group">
        <input type="text" id="textInput" placeholder="Taip teks...">
        <input type="color" id="textColor" value="#000000">
      </div>
      <button class="add-text-btn" id="addTextBtn">Tambah Teks</button>
    </div>

    <div class="gizmo-controls" id="gizmoControls">
      <div class="section-title" style="margin-bottom: 0;">Kawalan Logo</div>
      <div class="mode-buttons">
        <button class="mode-btn active" id="btnTranslate" title="Gerak">✥ Gerak</button>
        <button class="mode-btn" id="btnScale" title="Saiz">⤢ Saiz</button>
        <button class="mode-btn" id="btnRotate" title="Putar">⟳ Putar</button>
      </div>
    </div>

    <!-- ✅ PANEL KESAN IMEJ -->
    <div class="image-props" id="imageProps">
      <div class="section-title" style="margin-bottom: 8px;">Kesan Imej</div>

      <div class="prop-group">
        <label class="prop-label">Overlay Warna</label>
        <div class="prop-row">
          <input type="color" id="overlayColor" value="#ffffff">
          <input type="range" id="overlayOpacity" min="0" max="100" value="0">
          <span class="prop-val" id="overlayVal">0%</span>
        </div>
      </div>

      <div class="prop-group">
        <label class="prop-label">Stroke</label>
        <div class="prop-row">
          <input type="color" id="strokeColor" value="#000000">
          <input type="range" id="strokeWidth" min="0" max="20" value="0">
          <span class="prop-val" id="strokeVal">0</span>
        </div>
      </div>

      <div class="prop-group">
        <label class="prop-label">Drop Shadow</label>
        <div class="prop-row">
          <input type="color" id="shadowColor" value="#000000">
          <input type="range" id="shadowBlur" min="0" max="40" value="0">
          <span class="prop-val" id="shadowVal">0</span>
        </div>
        <div class="prop-row-inline">
          <label>X <input type="range" id="shadowX" min="-20" max="20" value="4"></label>
          <label>Y <input type="range" id="shadowY" min="-20" max="20" value="4"></label>
        </div>
      </div>
    </div>
    
    <button class="save-btn" id="saveBtn">⬇️ Simpan Design HD</button>
  </div>
  
  <div id="viewer-container">
    <div id="loading">MEMUATKAN STUDIO...</div>
    <div id="view-toggles">
      <button id="viewFront">Hadapan</button>
      <button id="viewBack">Belakang</button>
    </div>
  </div>

  <div id="sidebar-right">
    <div id="layers-header"><h2>Senarai Layer</h2></div>
    <div id="layers-list"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ===== 1. SETUP ASAS =====
const container = document.getElementById('viewer-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(0, 0, 4.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

const mainLight = new THREE.DirectionalLight(0xffffff, 2);
mainLight.position.set(5, 10, 5);
mainLight.castShadow = true;
mainLight.shadow.mapSize.width = 2048;
mainLight.shadow.mapSize.height = 2048;
scene.add(mainLight);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.ShadowMaterial({ opacity: 0.3 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.2;
ground.receiveShadow = true;
scene.add(ground);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 1.5;
controls.maxDistance = 10;

const transformControls = new TransformControls(camera, renderer.domElement);
transformControls.setMode('translate');
transformControls.setSize(0.8);
const transformHelper = transformControls.getHelper();
scene.add(transformHelper);

let isDragging = false;
transformControls.addEventListener('dragging-changed', (event) => {
  controls.enabled = !event.value;
  isDragging = event.value;
});

// ===== 2. STATE & MODEL =====
const shirtGroup = new THREE.Group();
scene.add(shirtGroup);

let shirtMeshes = [];
let shirtMaterials = [];
let activeDummy = null;
let logoCount = 0;

const raycaster = new THREE.Raycaster();
const layerListUI = document.getElementById('layers-list');
const gizmoControlsUI = document.getElementById('gizmoControls');
const imagePropsUI = document.getElementById('imageProps');

new GLTFLoader().load('./T_shirt_gltf.gltf', 
  (gltf) => setupShirt(gltf.scene), 
  undefined, 
  (err) => {
    console.error(err);
    document.getElementById('loading').innerText = 'Gagal memuatkan fail baju.';
  }
);

function setupShirt(model) {
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  model.scale.setScalar(2.4 / maxDim);
  model.updateMatrixWorld(true);

  box.setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(center);
  model.updateMatrixWorld(true);

  model.traverse((child) => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
      const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, metalness: 0.1 });
      child.material = mat;
      shirtMaterials.push(mat);
      shirtMeshes.push(child);
    }
  });

  shirtGroup.add(model);
  ground.position.y = box.min.y - 0.1;

  finishLoading();
  addBaseLayer();
}

function finishLoading() {
  const el = document.getElementById('loading');
  el.style.opacity = '0';
  setTimeout(() => el.remove(), 500);
}

// ===== 3. SISTEM LAYER =====
function addBaseLayer() {
  const el = document.createElement('div');
  el.className = 'layer-item active';
  el.innerHTML = `<div class="layer-info"><span class="layer-icon">👕</span> <span>Baju 3D (Asas)</span></div>`;
  el.onclick = () => {
    transformControls.detach();
    activeDummy = null;
    gizmoControlsUI.classList.remove('active');
    imagePropsUI.classList.remove('active');
    document.querySelectorAll('.layer-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
  };
  layerListUI.appendChild(el);
}

function addDesignLayer(dummy, name, icon) {
  const id = 'layer-' + Date.now() + Math.random().toString(36).substr(2, 5);
  dummy.userData.layerId = id;

  const el = document.createElement('div');
  el.className = 'layer-item';
  el.id = id;
  
  el.innerHTML = `
    <div class="layer-info">
      <span class="layer-icon">${icon}</span> 
      <span>${name}</span>
    </div>
    <button class="delete-btn" title="Padam">✕</button>
  `;

  el.onclick = (e) => {
    if (e.target.closest('.delete-btn')) return;
    selectLayer(dummy, el);
  };

  el.querySelector('.delete-btn').onclick = (e) => {
    e.stopPropagation();
    deleteLayer(dummy, el);
  };

  layerListUI.prepend(el);
  selectLayer(dummy, el);
}

function selectLayer(dummy, el) {
  document.querySelectorAll('.layer-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  
  activeDummy = dummy;
  transformControls.attach(dummy);
  gizmoControlsUI.classList.add('active');

  // Tunjuk panel kesan hanya untuk layer imej/teks
  if (dummy.userData.fx) {
    populateFXPanel(dummy);
    imagePropsUI.classList.add('active');
  } else {
    imagePropsUI.classList.remove('active');
  }
}

function deleteLayer(dummy, el) {
  transformControls.detach();
  
  if (dummy.userData.decals) {
    dummy.userData.decals.forEach(decal => {
      decal.parent?.remove(decal);
      decal.geometry.dispose();
      if (decal.material.map) decal.material.map.dispose();
      decal.material.dispose();
    });
  }
  
  if (dummy.userData.texture) dummy.userData.texture.dispose();
  shirtGroup.remove(dummy);
  
  el.remove();
  gizmoControlsUI.classList.remove('active');
  imagePropsUI.classList.remove('active');
  activeDummy = null;
}

// ===== 4. SISTEM DECAL (DIPERBAIKI) =====
function createDecal(dummy) {
  if (!shirtMeshes.length) return;

  // Bersihkan decal lama
  if (dummy.userData.decals) {
    dummy.userData.decals.forEach(decal => {
      decal.parent?.remove(decal);
      decal.geometry.dispose();
      if (decal.material.map) decal.material.map.dispose();
      decal.material.dispose();
    });
  }
  dummy.userData.decals = [];

  const w = 0.6 * dummy.scale.x;
  const h = (0.6 / dummy.userData.aspect) * dummy.scale.y;
  const size = new THREE.Vector3(w, h, 0.8); // ✅ depth lebih dalam supaya ikut lekuk

  // Semak jika logo berada di belakang baju
  const currentNormal = new THREE.Vector3(0, 0, 1).applyQuaternion(dummy.quaternion);
  const isBack = currentNormal.z < -0.1;

  // ✅ DecalGeometry perlukan Euler, bukan Quaternion
  const euler = new THREE.Euler().setFromQuaternion(dummy.quaternion);

  shirtMeshes.forEach(mesh => {
    try {
      const decalGeo = new DecalGeometry(mesh, dummy.position, euler, size);
      
      if (decalGeo.attributes.position && decalGeo.attributes.position.count > 0) {
        const tex = dummy.userData.texture.clone();
        if (isBack) {
          tex.wrapS = THREE.RepeatWrapping;
          tex.repeat.x = -1; // Flip gambar secara automatik (Anti-Mirror)
        }

        const decalMat = new THREE.MeshStandardMaterial({
          map: tex,
          transparent: true,
          depthTest: true,
          depthWrite: false,
          polygonOffset: true,
          polygonOffsetFactor: -4,
          roughness: 0.8,
          side: THREE.DoubleSide
        });

        const decalMesh = new THREE.Mesh(decalGeo, decalMat);
        decalMesh.renderOrder = 2;
        mesh.add(decalMesh); // ✅ parent yang betul (mesh yg diunjur)
        dummy.userData.decals.push(decalMesh);
      } else {
        decalGeo.dispose();
      }
    } catch(e) {
      console.warn("Decal gagal pada mesh ini:", e);
    }
  });
}

// Kemas kini posisi & putaran semasa Gizmo digunakan
transformControls.addEventListener('objectChange', () => {
  if (!activeDummy || !shirtMeshes.length) return;

  activeDummy.updateMatrixWorld();
  const worldPos = new THREE.Vector3().setFromMatrixPosition(activeDummy.matrixWorld);
  
  const dir = worldPos.clone().sub(camera.position).normalize();
  raycaster.set(camera.position, dir);
  
  const hits = raycaster.intersectObjects(shirtMeshes, true);
  
  if (hits.length > 0) {
    const hit = hits[0];
    const localHit = shirtGroup.worldToLocal(hit.point.clone());
    activeDummy.position.copy(localHit);

    // Snap orientasi ikut normal permukaan baju
    const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
    const localNormal = normal.clone()
      .transformDirection(new THREE.Matrix4().copy(shirtGroup.matrixWorld).invert())
      .normalize();
    
    const up = new THREE.Vector3(0, 1, 0);
    let right = new THREE.Vector3().crossVectors(up, localNormal);
    if (right.lengthSq() < 0.001) right.set(1, 0, 0);
    right.normalize();
    const actualUp = new THREE.Vector3().crossVectors(localNormal, right).normalize();
    
    const matrix = new THREE.Matrix4().makeBasis(right, actualUp, localNormal);
    activeDummy.quaternion.setFromRotationMatrix(matrix);
  }

  createDecal(activeDummy);
});

// ===== 5. PEMPROSESAN KESAN IMEJ (OVERLAY / STROKE / SHADOW) =====
function buildEffectTexture(source, fx) {
  const hasShadow  = fx.shadowBlur > 0 || Math.abs(fx.shadowOffsetX) > 0 || Math.abs(fx.shadowOffsetY) > 0;
  const hasStroke  = fx.strokeWidth > 0;
  const hasOverlay = fx.overlayOpacity > 0;

  // Padding supaya stroke/shadow tak terpotong
  const padX = Math.max(
    hasStroke ? fx.strokeWidth + 2 : 0,
    hasShadow ? fx.shadowBlur + Math.abs(fx.shadowOffsetX) + 2 : 0
  );
  const padY = Math.max(
    hasStroke ? fx.strokeWidth + 2 : 0,
    hasShadow ? fx.shadowBlur + Math.abs(fx.shadowOffsetY) + 2 : 0
  );

  const W = source.width + padX * 2;
  const H = source.height + padY * 2;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // 1) Drop Shadow (paling bawah)
  if (hasShadow) {
    ctx.save();
    ctx.shadowColor   = fx.shadowColor;
    ctx.shadowBlur    = fx.shadowBlur;
    ctx.shadowOffsetX = fx.shadowOffsetX;
    ctx.shadowOffsetY = fx.shadowOffsetY;
    ctx.drawImage(source, padX, padY);
    ctx.restore();
  }

  // 2) Stroke — silhouette dilation (32 arah)
  if (hasStroke) {
    const sil = document.createElement('canvas');
    sil.width = W; sil.height = H;
    const sctx = sil.getContext('2d');
    sctx.drawImage(source, padX, padY);
    sctx.globalCompositeOperation = 'source-in';
    sctx.fillStyle = fx.strokeColor;
    sctx.fillRect(0, 0, W, H);

    const steps = 32;
    for (let i = 0; i < steps; i++) {
      const a = (i / steps) * Math.PI * 2;
      ctx.drawImage(sil,
        Math.cos(a) * fx.strokeWidth,
        Math.sin(a) * fx.strokeWidth
      );
    }
  }

  // 3) Imej asal + tint overlay
  if (hasOverlay) {
    const tint = document.createElement('canvas');
    tint.width = W; tint.height = H;
    const tctx = tint.getContext('2d');
    tctx.drawImage(source, padX, padY);
    tctx.globalCompositeOperation = 'source-atop';
    tctx.globalAlpha = fx.overlayOpacity;
    tctx.fillStyle = fx.overlayColor;
    tctx.fillRect(0, 0, W, H);
    ctx.drawImage(tint, 0, 0);
  } else {
    ctx.drawImage(source, padX, padY);
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

// ===== 6. FUNGSI TAMBAH LOGO & TEKS =====
const DEFAULT_FX = {
  overlayColor:   '#ffffff',
  overlayOpacity: 0,
  strokeColor:    '#000000',
  strokeWidth:    0,
  shadowColor:    '#000000',
  shadowBlur:     0,
  shadowOffsetX:  4,
  shadowOffsetY:  4
};

document.getElementById('logoUpload').addEventListener('change', (e) => {
  const files = e.target.files;
  if (!files.length) return;

  for (let i = 0; i < files.length; i++) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => addLogoToScene(img, false);
      img.src = ev.target.result;
    };
    reader.readAsDataURL(files[i]);
  }
  e.target.value = '';
});

document.getElementById('addTextBtn').onclick = () => {
  const text = document.getElementById('textInput').value;
  const color = document.getElementById('textColor').value;
  if (!text) return;

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 1024;
  canvas.height = 256;
  ctx.fillStyle = color;
  ctx.font = "bold 120px Inter, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, 512, 128);

  addLogoToScene(canvas, true);
  document.getElementById('textInput').value = '';
};

function addLogoToScene(sourceImage, isText = false) {
  const fx = { ...DEFAULT_FX };
  const texture = buildEffectTexture(sourceImage, fx);

  const dummy = new THREE.Object3D();
  dummy.userData.texture     = texture;
  dummy.userData.sourceImage = sourceImage;
  dummy.userData.fx          = fx;
  dummy.userData.aspect      = texture.image.width / texture.image.height;
  shirtGroup.add(dummy);

  const offsetX = (logoCount % 2 === 0) ? 0.15 : -0.15;
  const offsetY = Math.floor(logoCount / 2) * -0.2;

  raycaster.setFromCamera(new THREE.Vector2(offsetX, offsetY), camera);
  const hits = raycaster.intersectObjects(shirtMeshes, true);

  if (hits.length > 0) {
    const hit = hits[0];
    dummy.position.copy(shirtGroup.worldToLocal(hit.point.clone()));

    const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
    const localNormal = normal.clone()
      .transformDirection(new THREE.Matrix4().copy(shirtGroup.matrixWorld).invert())
      .normalize();
    
    const up = new THREE.Vector3(0, 1, 0);
    let right = new THREE.Vector3().crossVectors(up, localNormal);
    if (right.lengthSq() < 0.001) right.set(1, 0, 0);
    right.normalize();
    const actualUp = new THREE.Vector3().crossVectors(localNormal, right).normalize();
    
    const matrix = new THREE.Matrix4().makeBasis(right, actualUp, localNormal);
    dummy.quaternion.setFromRotationMatrix(matrix);
  } else {
    dummy.position.set(0, 0, 0.5);
  }

  logoCount++;
  createDecal(dummy);

  const layerName = isText ? `Teks ${logoCount}` : `Logo ${logoCount}`;
  const icon = isText ? '📝' : '🖼️';
  addDesignLayer(dummy, layerName, icon);
}

// ===== 7. PANEL KESAN IMEJ =====
const fxUI = {
  overlayColor:   document.getElementById('overlayColor'),
  overlayOpacity: document.getElementById('overlayOpacity'),
  strokeColor:    document.getElementById('strokeColor'),
  strokeWidth:    document.getElementById('strokeWidth'),
  shadowColor:    document.getElementById('shadowColor'),
  shadowBlur:     document.getElementById('shadowBlur'),
  shadowX:        document.getElementById('shadowX'),
  shadowY:        document.getElementById('shadowY'),
};

function populateFXPanel(dummy) {
  const fx = dummy.userData.fx;
  fxUI.overlayColor.value   = fx.overlayColor;
  fxUI.overlayOpacity.value = Math.round(fx.overlayOpacity * 100);
  fxUI.strokeColor.value    = fx.strokeColor;
  fxUI.strokeWidth.value    = fx.strokeWidth;
  fxUI.shadowColor.value    = fx.shadowColor;
  fxUI.shadowBlur.value     = fx.shadowBlur;
  fxUI.shadowX.value        = fx.shadowOffsetX;
  fxUI.shadowY.value        = fx.shadowOffsetY;

  document.getElementById('overlayVal').textContent = Math.round(fx.overlayOpacity * 100) + '%';
  document.getElementById('strokeVal').textContent  = fx.strokeWidth;
  document.getElementById('shadowVal').textContent  = fx.shadowBlur;
}

function applyFXToActive() {
  if (!activeDummy || !activeDummy.userData.sourceImage) return;

  const newTexture = buildEffectTexture(
    activeDummy.userData.sourceImage,
    activeDummy.userData.fx
  );
  activeDummy.userData.aspect = newTexture.image.width / newTexture.image.height;

  const oldTexture = activeDummy.userData.texture;
  activeDummy.userData.texture = newTexture;

  createDecal(activeDummy);

  if (oldTexture && oldTexture !== newTexture) oldTexture.dispose();
}

function onFXChange() {
  if (!activeDummy || !activeDummy.userData.fx) return;
  const fx = activeDummy.userData.fx;

  fx.overlayColor   = fxUI.overlayColor.value;
  fx.overlayOpacity = parseInt(fxUI.overlayOpacity.value) / 100;
  fx.strokeColor    = fxUI.strokeColor.value;
  fx.strokeWidth    = parseInt(fxUI.strokeWidth.value);
  fx.shadowColor    = fxUI.shadowColor.value;
  fx.shadowBlur     = parseInt(fxUI.shadowBlur.value);
  fx.shadowOffsetX  = parseInt(fxUI.shadowX.value);
  fx.shadowOffsetY  = parseInt(fxUI.shadowY.value);

  document.getElementById('overlayVal').textContent = Math.round(fx.overlayOpacity * 100) + '%';
  document.getElementById('strokeVal').textContent  = fx.strokeWidth;
  document.getElementById('shadowVal').textContent  = fx.shadowBlur;

  applyFXToActive();
}

Object.values(fxUI).forEach(el => el.addEventListener('input', onFXChange));

};
document.getElementById('btnRotate').onclick = (e) => {

};

const colors = ['#ffffff', '#171717', '#64748b', '#dc2626', '#2563eb', '#16a34a', '#ca8a04', '#9333ea'];

document.getElementById('viewFront').onclick = () => { camera.position.set(0, 0, 4.5); controls.target.set(0, 0, 0); };
document.getElementById('viewBack').onclick = () => { camera.position.set(0, 0, -4.5); controls.target.set(0, 0, 0); };

document.getElementById('saveBtn').onclick = () => {
  transformHelper.visible = false;
  const currentSize = renderer.getSize(new THREE.Vector2());
  
  renderer.setSize(2000, 2000, false);
  renderer.render(scene, camera);
  const dataURL = renderer.domElement.toDataURL('image/png');
  
  renderer.setSize(currentSize.x, currentSize.y, false);
  transformHelper.visible = true;
  renderer.render(scene, camera);

  const link = document.createElement('a');
  link.download = 'design-baju-hd.png';
  link.href = dataURL;
  link.click();
};

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const width = container.clientWidth;
  const height = container.clientHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
});
